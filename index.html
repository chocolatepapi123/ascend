<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Ascend</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#f1f4f9;--cd:#fff;--ink:#111827;--mut:#6b7280;--ac:#3b6df6;--ln:#e5e7eb;--gd:#b7791f;--hp:#ef4444;--xp:#22c55e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.al{height:10px;border-radius:6px;position:relative;margin:5px 0 4px;background:linear-gradient(90deg,#c1121f,#4a1a2a 45%,#8a93a8 50%,#f4e7a1 55%,#fff6c9)}

.x{background:none;border:0;cursor:pointer;opacity:.5;padding:4px}
.wk{display:flex;justify-content:space-between}.dy{text-align:center;padding:6px 8px;border-radius:14px;min-width:40px}.dy b{display:block;font-size:16px}.dy.on{background:var(--ac);color:#fff}.dy.on small{color:#fff}
.ch{display:flex;gap:8px;align-items:flex-end;height:120px;margin-top:8px}.ch div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;text-align:center}.ch i{display:block;background:var(--ac);border-radius:6px 6px 2px 2px;min-height:3px}

.sm{border:0;background:var(--ac);color:#fff;font-weight:700;border-radius:10px;padding:8px 14px;cursor:pointer}

.nav button{background:none;border:0;color:var(--mut);font:600 11px inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}.nav button span{font-size:20px}.nav button.on{color:var(--ac)}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:4;width:56px;height:56px;border-radius:28px;border:0;background:var(--ac);color:#fff;font-size:30px;box-shadow:0 6px 16px rgba(59,109,246,.4);cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:6;display:flex;align-items:flex-end}.sh{background:var(--cd);width:100%;max-width:480px;margin:0 auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-weight:600;max-width:90%;text-align:center;z-index:9}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style></head><body><div class="w" id="app"></div><button class="fab" id="fab" aria-label="Add challenge" onclick="sheet=true;render()">+</button><div class="nav" id="nav"></div><div id="sheet"></div><div id="t"></div><script>const KEY='ascend_v1',clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WT={str:20,wis:18,vit:12,calm:12},NM={str:'Strength',vit:'Vitality',wis:'Wisdom',calm:'Calm'};
const PRE=[['Workout','str','daily'],['Study / deep work','wis','daily'],['Sleep 7h+','vit','daily'],['Eat clean','vit','daily'],['Meditate','calm','daily'],['Drink water','vit','habit',6],['Doomscrolling','calm','bad'],['Junk food','vit','bad']];
const COS=[{id:'shades',n:'Shades',c:60},{id:'chain',n:'Gold chain',c:90},{id:'cape',n:'Crimson cape',c:140}];
const ANG=['Mortal','Touched','Blessed','Exalted','Seraph'],DEV=['Mortal','Tempted','Corrupted','Infernal','Archdemon'];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dn=x=>Math.round(Date.parse(x+'T12:00:00')/864e5);
const uid=()=>Math.random().toString(36).slice(2,9);
function fresh(){return{hist:{},lvl:1,xp:0,hp:50,gold:20,align:0,streak:0,doneToday:false,day:today(),status:'alive',rev:null,stats:{str:30,vit:30,wis:30,calm:30},own:{},on:{},
tasks:[['Workout','str','daily'],['Study / deep work','wis','daily'],['Sleep 7h+','vit','daily'],['Meditate','calm','daily'],['Doomscrolling','calm','bad']].map(p=>mk(...p)),
rewards:[{id:uid(),n:'Favourite treat',c:40},{id:uid(),n:'Movie night',c:80}]}}
function mk(n,tag,type,w){return{id:uid(),n,tag,type,w:w||WT[tag],done:false}}
let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!s||!s.stats)s=fresh();s.hist=s.hist||{};
let tab='h',sheet=false,sm='tpl',sel={stat:'str',type:'daily'};
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function toast(m){const t=document.getElementById('t');t.innerHTML='<div class="toast">'+esc(m)+'</div>';clearTimeout(toast.h);toast.h=setTimeout(()=>t.innerHTML='',2600)}
function fall(){s.lvl=Math.max(1,s.lvl-1);s.gold=Math.floor(s.gold/2);s.xp=0;s.hp=0;s.status='revival';s.rev={dl:dn(today())+7,streak:0,doneToday:false};toast('You collapsed. Lost a level and half your gold.')}
function roll(){const t=today();if(s.day===t)return;const n=Math.min(3,dn(t)-dn(s.day));
if(s.status==='alive'){s.tasks.filter(x=>x.type==='daily').forEach(x=>{const m=(x.done?0:1)+n-1;for(let i=0;i<m;i++){s.hp-=6;s.align=clamp(s.align-3,-100,100);s.stats[x.tag]=Math.max(0,s.stats[x.tag]-2)}});
s.streak=(n===1&&s.doneToday)?s.streak+1:0;if(s.hp<=0){s.hp=0;fall()}}
else if(s.status==='revival'){if(!s.rev.doneToday||n>1)s.rev.streak=0;s.rev.doneToday=false;if(dn(t)>s.rev.dl)s.status='dead'}
s.tasks.forEach(x=>x.done=false);s.doneToday=false;s.day=t;save()}
function act(id){const x=s.tasks.find(v=>v.id===id);if(!x||s.status==='dead')return;const g=s.status==='revival';
if(x.type==='bad'){s.align=clamp(s.align-6,-100,100);s.stats[x.tag]=Math.max(0,s.stats[x.tag]-3);if(!g){s.hp-=10;if(s.hp<=0){s.hp=0;fall()}}toast('Ouch. Darkness creeps in.')}
else{if(x.type==='daily'&&x.done)return;const w=x.w;x.done=true;s.xp+=w*(g?.5:1);s.hist[today()]=(s.hist[today()]||0)+Math.round(w*(g?.5:1));s.gold+=Math.round(w/2);s.stats[x.tag]=Math.min(100,s.stats[x.tag]+w/5);
s.align=clamp(s.align+w/6+Math.min(s.streak,10)*.15,-100,100);s.doneToday=true;if(!g)s.hp=Math.min(50,s.hp+2);
if(g&&w>=18&&!s.rev.doneToday){s.rev.doneToday=true;s.rev.streak++;toast('Redemption day '+s.rev.streak+' of 3')}
else toast('+'+Math.round(w*(g?.5:1))+' XP  +'+Math.round(w/2)+' gold');
while(s.xp>=40+s.lvl*20){s.xp-=40+s.lvl*20;s.lvl++;s.hp=g?s.hp:50;toast('Level '+s.lvl+'!')}
if(x.type==='todo')s.tasks=s.tasks.filter(v=>v!==x)}save();render()}
function del(id){s.tasks=s.tasks.filter(v=>v.id!==id);save();render()}
function buy(k,id){if(s.status!=='alive')return toast('Revive first.');
if(k==='c'){const c=COS.find(v=>v.id===id);if(s.own[id]){s.on[id]=!s.on[id]}else if(s.gold>=c.c){s.gold-=c.c;s.own[id]=1;s.on[id]=1;toast(c.n+' equipped')}else toast('Not enough gold')}
else{const r=s.rewards.find(v=>v.id===id);if(s.gold>=r.c){s.gold-=r.c;toast('Enjoy: '+r.n)}else toast('Not enough gold')}save();render()}
function revive(){const c=100+25*s.lvl;if(s.rev.streak>=3&&s.gold>=c){s.gold-=c;s.status='alive';s.hp=25;s.rev=null;toast('You rise again.');save();render()}}
function reborn(){s=fresh();save();render()}
function addR(){const n=r_n.value.trim(),c=parseInt(r_c.value);if(!n||!(c>0))return;s.rewards.push({id:uid(),n,c});save();render()}
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)),mix=(a,b,t)=>{const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
function draw(){const S=s.stats,a=clamp(s.align,0,100)/100,d=clamp(-s.align,0,100)/100,m=Math.max(a,d),up=a>=d;
const low=clamp(1-s.hp/50,0,1),str=S.str,vit=S.vit,wis=S.wis,calm=S.calm,dead=s.status==='dead',gh=s.status==='revival';
const sw=24+str*.24,ar=11+str*.13,sl=low*10,hy=72+sl,ty=108+sl*.5,I='#0b0b0d';
const skin=`hsl(28,${20+vit*.45}%,${46+vit*.14}%)`,shirt=mix('#4a6fa5',up?'#f4f1e8':'#3a1018',m),eye=mix('#2a2a2a',up?'#f5c542':'#e02020',m),au=mix('#7ec8ff',up?'#ffd84a':'#ff3b3b',m);
const o=`stroke="${I}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
const ln=(x1,y1,x2,y2,w,c)=>`<path d="M${x1} ${y1}L${x2} ${y2}" fill="none" stroke="${I}" stroke-width="${w+6}" stroke-linecap="round"/><path d="M${x1} ${y1}L${x2} ${y2}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const X=100+sw-4,wing=(amt,fill,p)=>amt<.08?'':[0,1].map(i=>`<g ${i?'transform="translate(200,0) scale(-1,1)"':''} opacity="${clamp(amt*3,0,1)}"><path ${o} fill="${fill}" transform="translate(${X},130) scale(${.4+.6*amt}) translate(${-X},-130)" d="${p}"/></g>`).join('');
const aw=`M${X} 118C${X+30} 58 ${X+92} 28 ${X+96} 70C${X+100} 92 ${X+70} 100 ${X+80} 122C${X+60} 124 ${X+40} 140 ${X} 152Z`;
const dw=`M${X} 118L${X+30} 40L${X+48} 80L${X+70} 28L${X+84} 90L${X+102} 58L${X+90} 134Q${X+50} 120 ${X} 152Z`;
const bt=Math.max(0,(55-vit)/55)+low*.6,e=(x)=>dead?`<path d="M${x-4} ${hy-5}l8 8m0-8l-8 8" stroke="${I}" stroke-width="2.5"/>`:`<ellipse cx="${x}" cy="${hy-1}" rx="5" ry="${3.5-low}" fill="#fff" stroke="${I}" stroke-width="2"/><circle cx="${x}" cy="${hy-1}" r="2.6" fill="${eye}"/>`;
const k=clamp((60-calm)/60,-.3,1)*4+d*3-a,mo=clamp((.5-low)*10+(calm-50)*.06+a*2,-5,6);
const hn=(sg)=>`<path ${o} fill="#2b0a10" d="M${100+sg*16} ${hy-22}Q${100+sg*32} ${hy-40} ${100+sg*24} ${hy-54}Q${100+sg*8} ${hy-42} ${100+sg*6} ${hy-26}Z"/>`;
return`<svg viewBox="0 0 200 250" role="img" aria-label="Your character" style="overflow:visible;${dead?'filter:grayscale(1);opacity:.5':gh?'opacity:.55;filter:saturate(.4) brightness(1.2)':vit>60?`filter:drop-shadow(0 0 ${(vit-55)/3}px ${au})`:''}">
<defs><radialGradient id="au"><stop offset=".3" stop-color="${au}" stop-opacity=".85"/><stop offset="1" stop-color="${au}" stop-opacity="0"/></radialGradient></defs>
<circle cx="100" cy="130" r="${60+wis*.6}" fill="url(#au)" opacity="${clamp(.12+wis/130,0,.8)}"/>
${wing(a,'#fbfaf5',aw)}${wing(d,'#7a1020',dw)}
${d>.2?`<path d="M104 188Q${110+d*40} 215 ${126+d*14} ${176-d*10}" fill="none" stroke="#9c1625" stroke-width="5" stroke-linecap="round"/>`:''}
${s.on.cape?`<path ${o} fill="#b3122a" d="M${100-sw+4} ${ty}L${100+sw-4} ${ty}L${100+sw+12} 222Q100 240 ${100-sw-12} 222Z"/>`:''}
${ln(88,176,86,238,22+str*.05,'#23252e')}${ln(112,176,114,238,22+str*.05,'#23252e')}
<ellipse cx="82" cy="240" rx="14" ry="6" fill="${I}"/><ellipse cx="118" cy="240" rx="14" ry="6" fill="${I}"/>
${ln(100-sw,ty+6,100-sw-8,176+sl*.5,ar,skin)}${ln(100+sw,ty+6,100+sw+8,176+sl*.5,ar,skin)}
${ln(100,ty-12,100,ty+2,14,skin)}
<path ${o} fill="${shirt}" d="M${100-sw} ${ty+4}Q100 ${ty-8} ${100+sw} ${ty+4}L${116+str*.05} 182L${84-str*.05} 182Z"/>
${str>55?`<path d="M100 ${ty+8}V${ty+32}M${100-sw*.5} ${ty+14}Q${100-sw*.25} ${ty+30} 96 ${ty+30}M${100+sw*.5} ${ty+14}Q${100+sw*.25} ${ty+30} 104 ${ty+30}" stroke="${I}" stroke-width="2" fill="none" opacity="${(str-50)/60}"/>`:''}
${low>.4?`<g opacity="${low}"><path fill="${skin}" ${o} stroke-width="2" d="M82 ${ty+26}l10 6-6 5 12 4-14 8z"/><path fill="${skin}" ${o} stroke-width="2" d="M118 ${ty+14}l-12 6 7 5-10 6 13 6z"/></g>`:''}
${s.on.chain?`<path d="M88 ${ty+2}Q100 ${ty+26} 112 ${ty+2}" fill="none" stroke="#f2c200" stroke-width="3.5"/>`:''}
<ellipse cx="79" cy="${hy}" rx="4" ry="7" fill="${skin}" ${o} stroke-width="2"/><ellipse cx="121" cy="${hy}" rx="4" ry="7" fill="${skin}" ${o} stroke-width="2"/>
<ellipse cx="100" cy="${hy}" rx="21" ry="25" fill="${skin}" ${o}/>
<path ${o} fill="#1a1410" d="M79 ${hy-8}Q78 ${hy-36} 100 ${hy-33}Q123 ${hy-36} 121 ${hy-8}Q112 ${hy-22} 100 ${hy-20}Q88 ${hy-22} 79 ${hy-8}Z"/>
${d>.12?`<g transform="translate(100,${hy-30}) scale(${.5+d*.7}) translate(-100,${-(hy-30)})">${hn(-1)}${hn(1)}</g>`:''}
<path d="M85 ${hy-9}L96 ${hy-9+k}M115 ${hy-9}L104 ${hy-9+k}" stroke="${I}" stroke-width="3" stroke-linecap="round"/>
${e(91)}${e(109)}
${bt>.1?`<path d="M86 ${hy+5}q5 3 10 0M104 ${hy+5}q5 3 10 0" stroke="#5a3a5a" stroke-width="1.8" fill="none" opacity="${clamp(bt,0,.85)}"/>`:''}
<path d="M92 ${hy+13}Q100 ${hy+13+mo} 108 ${hy+13}" fill="none" stroke="${I}" stroke-width="3" stroke-linecap="round"/>
${s.on.shades?`<path d="M82 ${hy-7}h36v9q-4 4-8 0h-20q-4 4-8 0z" fill="${I}"/>`:''}
${calm<35||low>.5?`<path d="M126 ${hy-8}q-5 8 0 10q5-2 0-10z" fill="#6ec1ff" stroke="${I}" stroke-width="1.5"/>`:''}
${a>.1?`<ellipse cx="100" cy="${hy-42+Math.sin(0)}" rx="22" ry="6" fill="none" stroke="#ffd84a" stroke-width="4.5" opacity="${clamp(a*1.6,0,1)}" style="filter:drop-shadow(0 0 4px #ffd84a)"/>`:''}
</svg>`}

const SC={str:'#ef4444',vit:'#22c55e',wis:'#3b82f6',calm:'#a855f7'},DL='SMTWTFS';
const dstr=o=>{const d=new Date();d.setDate(d.getDate()+o);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fsec=()=>{const n=new Date();return Math.max(0,Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)-n)/1000))};
const cdT=()=>{const t=fsec();return[t/3600|0,(t%3600)/60|0,t%60].map(v=>String(v).padStart(2,'0')).join(':')};
setInterval(()=>{const e=document.getElementById('cd');if(e){e.textContent=cdT();if(fsec()<2)setTimeout(render,2500)}},1000);
const pb=(v,m,c)=>`<div class="bar"><i style="width:${clamp(v/m*100,0,100)}%;background:${c}"></i></div>`;
function info(){const A=Math.abs(s.align),ix=A<15?0:A<35?1:A<60?2:A<85?3:4,hr=new Date().getHours(),open=s.tasks.filter(x=>x.type==='daily'&&!x.done).length;
const say=s.status==='dead'?'Gone. Nothing left but a ghost story.':s.status==='revival'?'A ghost of yourself. Earn your way back.':s.hp<15?'Barely standing. One more slip and you fall.':s.hp<30?'Bruised, torn and exhausted.':(open&&hr>=18)?`Looks worried: ${open} daily${open>1?'s':''} still open.`:s.align>35?'Radiating. Keep it up.':s.align<-35?'Something dark is taking hold.':'Standing at the crossroads.';
return{ix,open,say,title:ix?(s.align>0?ANG:DEV)[ix]:'Mortal'}}
function row(x){const b=x.type==='bad';return`<div class="r${x.done?' dn':''}"><button class="ck${b?' bd':''}" aria-label="${b?'Log slip':'Complete'}" onclick="act('${x.id}')">${b?'✕':x.done?'✓':''}</button><div class="rb"><b>${esc(x.n)}</b><span><i style="color:${SC[x.tag]}">${NM[x.tag]}</i>${x.t?' · '+x.t:''}</span></div><em>${b?'−HP':'+'+x.w+' XP'}</em><button class="x" aria-label="Delete" onclick="del('${x.id}')">🗑</button></div>`}
function status(){let h='';if(s.status==='revival'){const c=100+25*s.lvl,dl=s.rev.dl-dn(today());h+=`<div class="cd red"><h3>Redemption</h3><p>Finish a hard task (Workout or Study) on 3 days in a row. ${dl} day${dl==1?'':'s'} left, or you die. A missed day resets the streak. XP is halved.</p>${pb(s.rev.streak,3,'var(--xp)')}<small>Streak ${s.rev.streak}/3</small><button class="btn" ${s.rev.streak>=3&&s.gold>=c?'':'disabled'} onclick="revive()">Revive for ${c} G</button></div>`}
if(s.status==='dead')h+=`<div class="cd red"><h3>You died</h3><p>The window closed. Start a new life.</p><button class="btn" onclick="reborn()">Reincarnate</button></div>`;return h}
function home(){const I=info(),need=40+s.lvl*20,dl=s.tasks.filter(x=>x.type==='daily'),d=dl.filter(x=>x.done).length,list=[...s.tasks].sort((a,b)=>a.done-b.done);
let h=`<div class="cd hero"><div class="chips"><span class="chip" style="background:${I.ix?(s.align>0?'#d99a00':'#c1121f'):'#6b7280'}">${I.title}</span><span class="chip" style="background:var(--ac)">Lv ${s.lvl}</span></div>${draw()}<p class="say">${I.say}</p>
<div class="lab"><span>HP</span><span>${Math.round(s.hp)}/50</span></div>${pb(s.hp,50,'var(--hp)')}<div class="lab"><span>Level progress</span><span>${Math.round(s.xp)} / ${need} XP</span></div>${pb(s.xp,need,'var(--ac)')}
<div class="lab"><span>Devil</span><span>Angel</span></div><div class="al"><b style="left:${50+s.align/2}%"></b></div></div>${status()}`;
if(s.status==='alive')h+=`<div class="cd"><div class="tp"><b>⏱ Time remaining</b><span class="cdp" id="cd">${cdT()}</span></div><p class="big">${I.open?I.open+' dailies remaining today':'All dailies done'}</p><small>${I.open?'Complete them now to avoid penalty!':'Your streak is safe today.'}</small>${pb(d,Math.max(1,dl.length),'var(--xp)')}</div>`;
return h+`<div class="cd"><div class="tp"><b>Today’s challenges</b><small>${s.streak} day streak</small></div>${list.map(row).join('')||'<small>Nothing yet. Tap + to add one.</small>'}</div>`}
function tasks(){const wk=[-6,-5,-4,-3,-2,-1,0].map(o=>{const k=dstr(o),dt=new Date(k+'T12:00:00');return`<div class="dy${o===0?' on':''}"><small>${DL[dt.getDay()]}</small><b>${dt.getDate()}</b><small>${s.hist[k]?'+'+s.hist[k]:'·'}</small></div>`}).join('');
const dl=s.tasks.filter(x=>x.type==='daily').sort((a,b)=>(a.t||'99').localeCompare(b.t||'99')),G=[['Morning',x=>x.t&&x.t<'12:00'],['Afternoon',x=>x.t&&x.t>='12:00'&&x.t<'18:00'],['Evening',x=>x.t&&x.t>='18:00'],['Anytime',x=>!x.t]];
let h=`<div class="cd"><div class="wk">${wk}</div></div>`;G.forEach(g=>{const l=dl.filter(g[1]);if(l.length)h+=`<h3>${g[0]}</h3>`+l.map(row).join('')});
const o=(n,t)=>{const l=s.tasks.filter(x=>t.includes(x.type));return l.length?`<h3>${n}</h3>`+l.map(row).join(''):''};return h+o('Habits',['habit','bad'])+o('To-dos',['todo'])}
function stats(){const v=[-6,-5,-4,-3,-2,-1,0].map(o=>[dstr(o),s.hist[dstr(o)]||0]),mx=Math.max(20,...v.map(a=>a[1])),tot=v.reduce((a,b)=>a+b[1],0);
return`<div class="cd"><div class="tp"><b>Trends</b><small>Last 7 days</small></div><p class="big">${tot} XP</p><div class="ch">${v.map(a=>`<div><i style="height:${a[1]/mx*100}%"></i><small>${DL[new Date(a[0]+'T12:00:00').getDay()]}</small></div>`).join('')}</div></div>
<div class="cd"><div class="tp"><b>🔥 Streak</b><b>${s.streak} days</b></div><div class="wk">${v.map(a=>`<div class="dy"><small>${DL[new Date(a[0]+'T12:00:00').getDay()]}</small><b>${a[1]?'✓':'·'}</b></div>`).join('')}</div></div>
<div class="cd"><div class="tp"><b>Stat distribution</b></div>${Object.keys(NM).map(k=>`<div class="lab"><span>${NM[k]}</span><span>${Math.round(s.stats[k])}/100</span></div>${pb(s.stats[k],100,SC[k])}`).join('')}<div class="lab"><span>Alignment</span><span>${Math.round(s.align)}</span></div></div>`}
function shop(){return`<h3>Real rewards</h3>${s.rewards.map(r=>`<div class="r"><div class="rb"><b>${esc(r.n)}</b><span>${r.c} G</span></div><button class="sm" onclick="buy('r','${r.id}')">Buy</button></div>`).join('')}
<div class="cd"><input id="r_n" placeholder="New reward" maxlength="40"><input id="r_c" type="number" min="1" placeholder="Cost in gold"><button class="btn" onclick="addR()">Add reward</button></div>
<h3>Cosmetics</h3>${COS.map(c=>`<div class="r"><div class="rb"><b>${c.n}</b><span>${s.own[c.id]?(s.on[c.id]?'Equipped':'Owned'):c.c+' G'}</span></div><button class="sm" onclick="buy('c','${c.id}')">${s.own[c.id]?(s.on[c.id]?'Remove':'Equip'):'Buy'}</button></div>`).join('')}`}
function pick(k,v,e){sel[k]=v;document.querySelectorAll('[data-k="'+k+'"]').forEach(b=>b.classList.toggle('on',b===e))}
function addNew(){const n=f_n.value.trim();if(!n)return toast('Name your challenge');const x=mk(n,sel.stat,sel.type);if(sel.type==='daily')x.t=f_t.value;s.tasks.push(x);sheet=false;save();render();toast('Added')}
function addPre(i){const p=PRE[i];s.tasks.push(mk(p[0],p[1],p[2],p[3]));sheet=false;save();render();toast('Added '+p[0])}
function sheetH(){const ch=(k,a)=>a.map(o=>`<button class="cp${sel[k]===o[0]?' on':''}" data-k="${k}" onclick="pick('${k}','${o[0]}',this)">${o[1]}</button>`).join('');
return`<div class="ov" onclick="sheet=false;render()"><div class="sh" onclick="event.stopPropagation()"><h3 style="margin-top:0">Add challenge</h3><div class="seg"><button class="${sm=='new'?'on':''}" onclick="sm='new';render()">New</button><button class="${sm=='tpl'?'on':''}" onclick="sm='tpl';render()">Templates</button></div>`+
(sm=='new'?`<input id="f_n" placeholder="Enter challenge name" maxlength="50"><small>Type</small><div class="cps">${ch('type',[['daily','Daily'],['habit','Habit'],['bad','Bad habit'],['todo','To-do']])}</div><small>Target stat</small><div class="cps">${ch('stat',Object.keys(NM).map(k=>[k,NM[k]]))}</div><small>Time (dailies)</small><input id="f_t" type="time"><small>XP reward is automatic by stat.</small><button class="btn" onclick="addNew()">Add challenge</button>`:PRE.map((p,i)=>`<div class="r"><div class="rb"><b>${p[0]}</b><span><i style="color:${SC[p[1]]}">${NM[p[1]]}</i> · ${p[2]==='bad'?'bad habit':p[2]}</span></div><button class="sm" onclick="addPre(${i})">Add</button></div>`).join(''))+`</div></div>`}
function render(){roll();const T={h:['Home',home],t:['Tasks',tasks],x:['Stats',stats],s:['Shop',shop]};
document.getElementById('app').innerHTML=`<div class="tp top"><h1>${T[tab][0]}</h1><span class="gp">🪙 ${Math.floor(s.gold)}</span></div>${T[tab][1]()}`;
document.getElementById('nav').innerHTML=[['h','🏠','Home'],['t','✅','Tasks'],['x','📊','Stats'],['s','🛒','Shop']].map(a=>`<button class="${tab==a[0]?'on':''}" onclick="tab='${a[0]}';render();scrollTo(0,0)"><span>${a[1]}</span>${a[2]}</button>`).join('');
document.getElementById('fab').style.display=(tab=='h'||tab=='t')&&s.status!=='dead'?'block':'none';
document.getElementById('sheet').innerHTML=sheet?sheetH():''}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
render();
</script></body></html>
