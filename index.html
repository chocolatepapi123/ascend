<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Ascend</title><style>
:root{--bg:#f5f3ee;--cd:#fffefb;--ink:#22201c;--mut:#6f6a61;--pk:#2f6f5e;--gd:#8a6212;--ln:#dedad0;--hp:#b5483a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171613;--cd:#201f1b;--ink:#efece4;--mut:#a29c90;--pk:#5fb59d;--gd:#e0b44f;--ln:#37352e;--hp:#e0705f}}
:root[data-theme=dark]{--bg:#171613;--cd:#201f1b;--ink:#efece4;--mut:#a29c90;--pk:#5fb59d;--gd:#e0b44f;--ln:#37352e;--hp:#e0705f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.w{max-width:480px;margin:0 auto;padding:12px 18px 110px}
h1,h2,h3{margin:0;font-weight:650}
.hd{display:flex;align-items:center;gap:6px;position:relative;margin-bottom:6px}
.hd h1{flex:1;font-size:20px}
.gp{display:flex;align-items:center;gap:5px;font-weight:600;color:var(--gd);font-size:14px;padding:5px 10px;border-radius:999px;background:var(--cd);border:1px solid var(--ln)}
.ib{background:none;border:0;color:var(--ink);padding:7px;cursor:pointer;display:flex}
.mn{position:absolute;right:0;top:46px;background:var(--cd);border:1px solid var(--ln);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.14);z-index:5;min-width:190px;overflow:hidden}
.mn button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--ln);color:var(--ink);font:inherit;padding:13px 14px;cursor:pointer}.mn button:last-child{border:0}
.kick{margin:14px 0 0;color:var(--mut);font-size:14px}
.hl{font-size:30px;font-weight:700;line-height:1.1;margin:2px 0 4px}
.sub{margin:0 0 14px;color:var(--mut)}.sub b{color:var(--ink);font-variant-numeric:tabular-nums}
.lv{margin:0 0 16px}.lab{display:flex;justify-content:space-between;font-size:13.5px;color:var(--mut);margin-top:10px}
.bar{height:7px;background:var(--ln);margin:5px 0;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 4px}
.sec h3{font-size:16px}.sec span{font-size:13.5px;color:var(--mut)}
.r{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--ln)}
.r::before{content:"";width:3px;align-self:stretch;border-radius:2px;background:var(--c,transparent)}
.r.dn .rb{opacity:.5}.r.dn b{text-decoration:line-through}
.rb{flex:1;min-width:0}.rb b{display:block;font-weight:600}.rb span{font-size:13.5px;color:var(--mut)}
.r em{font-style:normal;font-size:13.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.ck{width:28px;height:28px;border:1.5px solid var(--mut);border-radius:50%;background:none;color:#fff;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;padding:0}
.r.dn .ck{background:var(--pk);border-color:var(--pk)}.ck.bd{color:var(--hp);border-color:var(--hp)}
.x{background:none;border:0;color:var(--mut);opacity:.6;padding:6px;cursor:pointer;display:flex}
.addb{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;margin-top:16px;padding:13px;background:none;border:1px solid var(--ln);border-radius:10px;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.box{background:var(--cd);border:1px solid var(--ln);border-left:4px solid var(--hp);padding:14px 16px;margin:12px 0 18px;border-radius:10px}.box h3{font-size:17px;margin-bottom:4px}.box p{margin:4px 0 8px;color:var(--mut)}
.wk{display:flex;justify-content:space-between;margin:14px 0 4px}.dy{text-align:center;padding:5px 6px;min-width:42px;border-radius:8px;font-variant-numeric:tabular-nums}.dy b{display:block;font-size:16px;font-weight:600}.dy small{display:block;color:var(--mut);font-size:11px}.dy.on{background:var(--cd);border:1px solid var(--ln)}
.ch{display:flex;gap:8px;align-items:flex-end;height:120px;margin:10px 0}.ch div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;text-align:center}.ch i{display:block;background:var(--pk);min-height:3px;border-radius:4px 4px 0 0}.ch small{color:var(--mut);font-size:11px;margin-top:4px}
.big{font:700 28px system-ui,sans-serif;margin:8px 0 0}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--pk);color:#fff;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}.btn:disabled{opacity:.4}
.sm{border:1px solid var(--ln);background:var(--cd);color:var(--ink);font:inherit;font-size:14px;font-weight:600;border-radius:8px;padding:7px 14px;cursor:pointer}
input{width:100%;padding:12px;margin:8px 0;border:1px solid var(--ln);border-radius:10px;background:var(--cd);color:var(--ink);font:inherit}
.seg{display:flex;background:var(--ln);border-radius:10px;padding:3px;margin:12px 0}.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;font-size:14px;padding:8px;border-radius:8px;cursor:pointer}.seg button.on{background:var(--cd);color:var(--ink)}
.cps{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.cp{border:1px solid var(--ln);background:var(--cd);color:var(--ink);padding:7px 13px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}.cp.on{background:var(--pk);border-color:var(--pk);color:#fff}
small{color:var(--mut);font-size:13px;display:block}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--ln);display:flex;z-index:4;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px}.nav button.on{color:var(--pk);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(10,10,8,.5);z-index:6;display:flex;align-items:flex-end}.sh{background:var(--bg);width:100%;max-width:480px;margin:0 auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;max-width:90%;text-align:center;z-index:9}
.cv{height:min(56vh,500px);min-height:330px;margin:0 -18px;position:relative}.cv canvas{width:100%;height:100%;display:block;touch-action:pan-y}
.say{margin:6px 0 14px;font-size:16px}.note{color:var(--mut);font-size:13px;margin-top:22px}
button:focus-visible,input:focus-visible{outline:3px solid var(--pk);outline-offset:2px}
</style></head><body><div class="w" id="app"></div><div class="nav" id="nav"></div><div id="sheet"></div><div id="t"></div><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script><script>const KEY='ascend_v1',clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WT={str:20,wis:18,vit:12,calm:12},NM={str:'Strength',vit:'Vitality',wis:'Wisdom',calm:'Calm'};
const PRE=[['Workout','str','daily'],['Study / deep work','wis','daily'],['Sleep 7h+','vit','daily'],['Eat clean','vit','daily'],['Meditate','calm','daily'],['Drink water','vit','habit',6],['Doomscrolling','calm','bad'],['Junk food','vit','bad']];
const COS=[{id:'shades',n:'Shades',k:'Head',c:60},{id:'cap',n:'Cap',k:'Head',c:70},{id:'chain',n:'Gold chain',k:'Neck',c:90},{id:'sneakers',n:'Sneakers',k:'Feet',c:80},{id:'hoodie',n:'Hoodie',k:'Torso',c:110},{id:'cape',n:'Cape',k:'Back',c:140}];
const RK=['Newcomer','Regular','Committed','Veteran','Elite'];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dn=x=>Math.round(Date.parse(x+'T12:00:00')/864e5);
const uid=()=>Math.random().toString(36).slice(2,9);
function fresh(){return{hist:{},lvl:1,xp:0,hp:50,gold:20,align:0,streak:0,doneToday:false,day:today(),status:'alive',rev:null,stats:{str:30,vit:30,wis:30,calm:30},own:{},on:{},
tasks:[['Workout','str','daily'],['Study / deep work','wis','daily'],['Sleep 7h+','vit','daily'],['Meditate','calm','daily'],['Doomscrolling','calm','bad']].map(p=>mk(...p)),
rewards:[{id:uid(),n:'Favourite treat',c:40},{id:uid(),n:'Movie night',c:80}]}}
function mk(n,tag,type,w){return{id:uid(),n,tag,type,w:w||WT[tag],done:false}}
let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!s||!s.stats)s=fresh();s.hist=s.hist||{};
let tab='h',menu=false,sheet=false,sm='tpl',sel={stat:'str',type:'daily'};
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function toast(m){const t=document.getElementById('t');t.innerHTML='<div class="toast">'+esc(m)+'</div>';clearTimeout(toast.h);toast.h=setTimeout(()=>t.innerHTML='',2600)}
function fall(){s.lvl=Math.max(1,s.lvl-1);s.gold=Math.floor(s.gold/2);s.xp=0;s.hp=0;s.status='revival';s.rev={dl:dn(today())+7,streak:0,doneToday:false};toast('You collapsed. Lost a level and half your LowGold.')}
function roll(){const t=today();if(s.day===t)return;const n=Math.min(3,dn(t)-dn(s.day));
if(s.status==='alive'){s.tasks.filter(x=>x.type==='daily').forEach(x=>{const m=(x.done?0:1)+n-1;for(let i=0;i<m;i++){s.hp-=6;s.stats[x.tag]=Math.max(0,s.stats[x.tag]-2)}});
s.streak=(n===1&&s.doneToday)?s.streak+1:0;if(s.hp<=0){s.hp=0;fall()}}
else if(s.status==='revival'){if(!s.rev.doneToday||n>1)s.rev.streak=0;s.rev.doneToday=false;if(dn(t)>s.rev.dl)s.status='dead'}
s.tasks.forEach(x=>x.done=false);s.doneToday=false;s.day=t;save()}
function act(id){const x=s.tasks.find(v=>v.id===id);if(!x||s.status==='dead')return;const g=s.status==='revival';
if(x.type==='bad'){s.stats[x.tag]=Math.max(0,s.stats[x.tag]-3);if(!g){s.hp-=10;if(s.hp<=0){s.hp=0;fall()}}toast('Slip logged'+(g?'':'. -10 HP'))}
else{if(x.type==='daily'&&x.done)return;const w=x.w;x.done=true;s.xp+=w*(g?.5:1);s.hist[today()]=(s.hist[today()]||0)+Math.round(w*(g?.5:1));s.gold+=Math.round(w/2);s.stats[x.tag]=Math.min(100,s.stats[x.tag]+w/5);
s.doneToday=true;if(!g)s.hp=Math.min(50,s.hp+2);
if(g&&w>=18&&!s.rev.doneToday){s.rev.doneToday=true;s.rev.streak++;toast('Recovery day '+s.rev.streak+' of 3')}
else toast('+'+Math.round(w*(g?.5:1))+' XP  +'+Math.round(w/2)+' LowGold');
while(s.xp>=40+s.lvl*20){s.xp-=40+s.lvl*20;s.lvl++;s.hp=g?s.hp:50;toast('Level '+s.lvl+'!')}
if(x.type==='todo')s.tasks=s.tasks.filter(v=>v!==x)}save();render()}
function del(id){s.tasks=s.tasks.filter(v=>v.id!==id);save();render()}
function buy(k,id){if(s.status!=='alive')return toast('Finish recovery first');
if(k==='c'){const c=COS.find(v=>v.id===id);if(s.own[id]){s.on[id]=!s.on[id]}else if(s.gold>=c.c){s.gold-=c.c;s.own[id]=1;s.on[id]=1;toast(c.n+' equipped')}else toast('Not enough LowGold')}
else{const r=s.rewards.find(v=>v.id===id);if(s.gold>=r.c){s.gold-=r.c;toast('Enjoy: '+r.n)}else toast('Not enough LowGold')}save();render()}
function revive(){const c=100+25*s.lvl;if(s.rev.streak>=3&&s.gold>=c){s.gold-=c;s.status='alive';s.hp=25;s.rev=null;toast('Back on your feet');save();render()}}
function reborn(){s=fresh();save();render()}
function addR(){const n=r_n.value.trim(),c=parseInt(r_c.value);if(!n||!(c>0))return;s.rewards.push({id:uid(),n,c});save();render()}
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)),mix=(a,b,t)=>{const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const SC={str:'#e8453c',vit:'#2fa55b',wis:'#2f7fd8',calm:'#9b5de5'},DL='SMTWTFS';
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',tasks:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>',stats:'<path d="M5 21V10M12 21V3M19 21v-7"/>',shop:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',dots:'<circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/>',plus:'<path d="M12 5v14M5 12h14"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',check:'<path d="M5 12l5 5 9-10"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',back:'<path d="M15 5l-7 7 7 7"/>',coin:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1 1.2-1.7 2.5-1.7s2.5.7 2.5 1.7-1.2 1.5-2.5 1.7-2.5.7-2.5 1.7 1.2 1.7 2.5 1.7 2.5-.7 2.5-1.7"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',reset:'<path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/>'};
const ic=(n,z)=>`<svg width="${z||20}" height="${z||20}" viewBox="0 0 24 24" fill="${n=='dots'?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const dstr=o=>{const d=new Date();d.setDate(d.getDate()+o);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fsec=()=>{const n=new Date();return Math.max(0,Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)-n)/1000))};
const cdT=()=>{const t=fsec();return[t/3600|0,(t%3600)/60|0,t%60].map(v=>String(v).padStart(2,'0')).join(':')};
setInterval(()=>{const e=document.getElementById('cd');if(e){e.textContent=cdT();if(fsec()<2)setTimeout(render,2500)}},1000);
const pb=(v,m,c)=>`<div class="bar"><i style="width:${clamp(v/m*100,0,100)}%;background:${c}"></i></div>`;
function info(){const hr=new Date().getHours(),open=s.tasks.filter(x=>x.type==='daily'&&!x.done).length;
const say=s.status==='dead'?'Your character is gone. Start a new run when you are ready.':s.status==='revival'?'Recovering. Finish hard tasks to get back up.':s.hp<15?'Very low health. One more slip and you collapse.':s.hp<30?'Worn down. Get some dailies done.':(open&&hr>=18)?open+' daily'+(open>1?'s':'')+' still open tonight.':'In good shape.';
return{open,say,title:RK[Math.min(4,Math.floor((s.lvl-1)/5))]}}
function row(x){const b=x.type==='bad';return`<div class="r${x.done?' dn':''}" style="--c:${SC[x.tag]}"><button class="ck${b?' bd':''}" aria-label="${b?'Log a slip':'Complete'}" onclick="act('${x.id}')">${b?ic('x',16):x.done?ic('check',16):''}</button><div class="rb"><b>${esc(x.n)}</b><span>${NM[x.tag]}${x.t?', '+x.t:''}</span></div><em>${b?'costs HP':'+'+x.w+' XP'}</em><button class="x" aria-label="Delete" onclick="del('${x.id}')">${ic('trash',16)}</button></div>`}
const addB=`<button class="addb" onclick="sheet=true;render()">${ic('plus',16)} Add a task</button>`;
function status(){let h='';if(s.status==='revival'){const c=100+25*s.lvl,dl=s.rev.dl-dn(today());h+=`<div class="box"><h3>Recovery</h3><p>Finish a hard task (Workout or Study) three days in a row. You have ${dl} day${dl==1?'':'s'} left. Miss a day and the streak resets. XP is halved until you are back.</p>${pb(s.rev.streak,3,'var(--pk)')}<small>${s.rev.streak} of 3 days</small><button class="btn" ${s.rev.streak>=3&&s.gold>=c?'':'disabled'} onclick="revive()">Get back up for ${c} LowGold</button></div>`}
if(s.status==='dead')h+=`<div class="box"><h3>Run over</h3><p>The recovery window closed.</p><button class="btn" onclick="reborn()">Start a new run</button></div>`;return h}
function lvBlock(){const need=40+s.lvl*20;return`<div class="lv"><div class="lab"><span>Level ${s.lvl}</span><span>${Math.round(s.xp)} / ${need} XP</span></div>${pb(s.xp,need,'var(--pk)')}<div class="lab"><span>Health</span><span>${Math.round(s.hp)} / 50</span></div>${pb(s.hp,50,'#2fa55b')}</div>`}
function home(){const I=info(),list=[...s.tasks].sort((a,b)=>a.done-b.done),wd=new Date().toLocaleDateString(undefined,{weekday:'long'});
return`<p class="kick">${wd}</p><h2 class="hl">${s.status!=='alive'?'Recovery mode':I.open?I.open+' to do today':'All done today'}</h2>${s.status==='alive'?`<p class="sub"><b id="cd">${cdT()}</b> left today</p>`:''}${status()}${lvBlock()}<div class="sec"><h3>Today</h3><span>${s.streak} day streak</span></div>${list.map(row).join('')||'<p class="sub" style="margin-top:12px">Nothing on your plate yet.</p>'}${addB}`}
function tasks(){const wk=[-6,-5,-4,-3,-2,-1,0].map(o=>{const k=dstr(o),dt=new Date(k+'T12:00:00');return`<div class="dy${o===0?' on':''}"><small>${DL[dt.getDay()]}</small><b>${dt.getDate()}</b><small>${s.hist[k]?'+'+s.hist[k]:'-'}</small></div>`}).join('');
const dl=s.tasks.filter(x=>x.type==='daily').sort((a,b)=>(a.t||'99').localeCompare(b.t||'99')),G=[['Morning',x=>x.t&&x.t<'12:00'],['Afternoon',x=>x.t&&x.t>='12:00'&&x.t<'18:00'],['Evening',x=>x.t&&x.t>='18:00'],['Anytime',x=>!x.t]];
let h=`<div class="wk">${wk}</div>`;G.forEach(g=>{const l=dl.filter(g[1]);if(l.length)h+=`<div class="sec"><h3>${g[0]}</h3></div>`+l.map(row).join('')});
const o=(n,t)=>{const l=s.tasks.filter(x=>t.includes(x.type));return l.length?`<div class="sec"><h3>${n}</h3></div>`+l.map(row).join(''):''};return h+o('Habits',['habit','bad'])+o('To-dos',['todo'])+addB}
function statBars(){return Object.keys(NM).map(k=>`<div class="lab"><span>${NM[k]}</span><span>${Math.round(s.stats[k])} / 100</span></div>${pb(s.stats[k],100,SC[k])}`).join('')}
function stats(){const v=[-6,-5,-4,-3,-2,-1,0].map(o=>[dstr(o),s.hist[dstr(o)]||0]),mx=Math.max(20,...v.map(a=>a[1])),tot=v.reduce((a,b)=>a+b[1],0),l=a=>DL[new Date(a[0]+'T12:00:00').getDay()];
return`<div class="sec"><h3>This week</h3><span>XP per day</span></div><p class="big">${tot} XP</p><div class="ch">${v.map(a=>`<div><i style="height:${a[1]/mx*100}%"></i><small>${l(a)}</small></div>`).join('')}</div>
<div class="sec"><h3>Streak</h3><span>${s.streak} days</span></div><div class="wk">${v.map(a=>`<div class="dy"><small>${l(a)}</small><b>${a[1]?ic('check',18):'-'}</b></div>`).join('')}</div>
<div class="sec"><h3>Stats</h3></div>${statBars()}`}
function shop(){return`<div class="sec"><h3>Real rewards</h3><span>you decide these</span></div>${s.rewards.map(r=>`<div class="r"><div class="rb"><b>${esc(r.n)}</b><span>${r.c} LowGold</span></div><button class="sm" onclick="buy('r','${r.id}')">Buy</button></div>`).join('')}
<input id="r_n" placeholder="New reward" maxlength="40"><input id="r_c" type="number" min="1" placeholder="Cost in LowGold"><button class="btn" onclick="addR()">Add reward</button>
<div class="sec"><h3>Gear</h3><span>shown on your character</span></div>${COS.map(c=>`<div class="r"><div class="rb"><b>${c.n}</b><span>${c.k}, ${s.own[c.id]?(s.on[c.id]?'wearing':'owned'):c.c+' LowGold'}</span></div><button class="sm" onclick="buy('c','${c.id}')">${s.own[c.id]?(s.on[c.id]?'Take off':'Wear'):'Buy'}</button></div>`).join('')}`}
function chr(){const I=info(),own=COS.filter(c=>s.own[c.id]);
return`<div class="cv" id="cv">${window.THREE?'':'<p class="sub" style="padding:24px 16px">The 3D view could not load. It needs an internet connection the first time.</p>'}</div><p class="say">${I.say}</p>${lvBlock()}<div class="sec"><h3>Rank</h3><span>${I.title}, level ${s.lvl}</span></div>${statBars()}
<div class="sec" id="wd"><h3>Wardrobe</h3><span>${own.length} of ${COS.length} owned</span></div>${own.map(c=>`<div class="r"><div class="rb"><b>${c.n}</b><span>${c.k}</span></div><button class="sm" onclick="buy('c','${c.id}')">${s.on[c.id]?'Take off':'Wear'}</button></div>`).join('')||'<p class="sub" style="margin-top:12px">Nothing owned yet. Buy gear in the Shop and it shows up here.</p>'}
<p class="note">${glb===1?'Using your character.glb model.':'Using the built-in placeholder. Add a character.glb file next to index.html to use your own model.'}</p>`}
function pick(k,v,e){sel[k]=v;document.querySelectorAll('[data-k="'+k+'"]').forEach(b=>b.classList.toggle('on',b===e))}
function addNew(){const n=f_n.value.trim();if(!n)return toast('Give it a name first');const x=mk(n,sel.stat,sel.type);if(sel.type==='daily')x.t=f_t.value;s.tasks.push(x);sheet=false;save();render();toast('Added')}
function addPre(i){const p=PRE[i];s.tasks.push(mk(p[0],p[1],p[2],p[3]));sheet=false;save();render();toast('Added '+p[0])}
function sheetH(){const ch=(k,a)=>a.map(o=>`<button class="cp${sel[k]===o[0]?' on':''}" data-k="${k}" onclick="pick('${k}','${o[0]}',this)">${o[1]}</button>`).join('');
return`<div class="ov" onclick="sheet=false;render()"><div class="sh" onclick="event.stopPropagation()"><h3>Add a task</h3><div class="seg"><button class="${sm=='new'?'on':''}" onclick="sm='new';render()">Write your own</button><button class="${sm=='tpl'?'on':''}" onclick="sm='tpl';render()">Quick picks</button></div>`+
(sm=='new'?`<input id="f_n" placeholder="What are you doing?" maxlength="50"><small>How often</small><div class="cps">${ch('type',[['daily','Every day'],['habit','Habit'],['bad','Bad habit'],['todo','One-off']])}</div><small>Builds which stat</small><div class="cps">${ch('stat',Object.keys(NM).map(k=>[k,NM[k]]))}</div><small>Time of day (daily only)</small><input id="f_t" type="time"><small>XP depends on the stat, so you can't cheat the scale.</small><button class="btn" onclick="addNew()">Add it</button>`:PRE.map((p,i)=>`<div class="r" style="--c:${SC[p[1]]}"><div class="rb"><b>${p[0]}</b><span>${NM[p[1]]}, ${p[2]==='bad'?'bad habit':p[2]==='daily'?'every day':'habit'}</span></div><button class="sm" onclick="addPre(${i})">Add</button></div>`).join(''))+`</div></div>`}
const menuH=()=>menu?`<div class="mn" onclick="event.stopPropagation()"><button onclick="menu=false;tab='c';render();scrollTo(0,0)">${ic('user',18)}Character</button><button onclick="menu=false;confirm('Reset all progress?')?reborn():render()">${ic('reset',18)}Reset progress</button></div>`:'';
document.addEventListener('click',()=>{if(menu){menu=false;render()}});
function render(){roll();s.hist=s.hist||{};const T={h:['Ascend',home],t:['Tasks',tasks],x:['Stats',stats],s:['Shop',shop],c:['Character',chr]};
document.getElementById('app').innerHTML=`<header class="hd">${tab==='c'?`<button class="ib" aria-label="Back" onclick="tab='h';render()">${ic('back',22)}</button>`:''}<h1>${T[tab][0]}</h1><span class="gp">${ic('coin',16)}${Math.floor(s.gold)} LowGold</span><button class="ib" aria-label="Menu" onclick="event.stopPropagation();menu=!menu;render()">${ic('dots',22)}</button>${menuH()}</header>${T[tab][1]()}`;
document.getElementById('nav').innerHTML=[['h','home','Home'],['t','tasks','Tasks'],['x','stats','Stats'],['s','shop','Shop']].map(a=>`<button class="${tab==a[0]?'on':''}" onclick="tab='${a[0]}';menu=false;render();scrollTo(0,0)">${ic(a[1],22)}<span>${a[2]}</span></button>`).join('');
document.getElementById('sheet').innerHTML=sheet?sheetH():'';if(tab==='c')mount3d()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});

const mkGT=()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)};
const T=c=>new THREE.MeshToonMaterial({color:c,gradientMap:G3}),B=(c,o)=>new THREE.MeshBasicMaterial(Object.assign({color:c},o||{}));

function fit(g){MODEL=g.scene;const b=new THREE.Box3().setFromObject(MODEL),z=b.getSize(new THREE.Vector3());MODEL.scale.multiplyScalar(3.6/z.y);const b2=new THREE.Box3().setFromObject(MODEL),c=b2.getCenter(new THREE.Vector3());MODEL.position.x-=c.x;MODEL.position.z-=c.z;MODEL.position.y-=b2.min.y;
MODEL.traverse(o=>{if(o.isMesh){o.frustumCulled=false;[].concat(o.material).forEach(m=>{if(m.color&&!m.userData.c0)m.userData.c0=m.color.clone()})}});
MODEL.updateMatrixWorld(true);const fb=re=>{let r=null;MODEL.traverse(o=>{if(!r&&o.isBone&&re.test(o.name))r=o});return r};
BN={head:fb(/head$/i),chest:fb(/spine2$|upper_?chest$/i)||fb(/spine1$|chest$/i),feet:[]};MODEL.traverse(o=>{if(o.isBone&&/foot$/i.test(o.name)&&BN.feet.length<2)BN.feet.push(o)});
const top=fb(/headtop_?end$/i);if(BN.head&&top){const p=new THREE.Vector3(),q=new THREE.Vector3();BN.head.getWorldPosition(p);top.getWorldPosition(q);HR=Math.max(.15,p.distanceTo(q)*.5)}
if(g.animations&&g.animations.length){MIX=new THREE.AnimationMixer(MODEL);MIX.clipAction(g.animations[0]).play()}}
function attach(bone,grp,x,y,z){MODEL.updateMatrixWorld(true);const ws=new THREE.Vector3(),qb=new THREE.Quaternion(),qm=new THREE.Quaternion();bone.getWorldScale(ws);bone.getWorldQuaternion(qb);MODEL.getWorldQuaternion(qm);
const o=new THREE.Group();o.scale.setScalar(1/ws.x);o.quaternion.copy(qb.invert().multiply(qm));grp.position.set(x,y,z);o.add(grp);bone.add(o);GEAR.push(o)}
/* gear is built around the part it sits on, in model units, so it works on both the placeholder and a loaded rig */
const gHead=hr=>{const g=new THREE.Group();
if(s.on.shades)g.add(at(mk3(new THREE.BoxGeometry(hr*1.5,hr*.3,hr*.3),'#0b0b0d',0),0,hr*.12,hr*.9));
if(s.on.cap){const r=hr*1.1;g.add(at(mk3(new THREE.SphereGeometry(r,16,10,0,Math.PI*2,0,Math.PI/2),'#1b1b22',1.04),0,hr*.25,0),at(mk3(new THREE.BoxGeometry(r*1.5,.04,r*.9),'#b8452c',1.04),0,hr*.27,r*.95))}return g};
const gChest=(w,hr,zf,zb)=>{const g=new THREE.Group();
if(s.on.hoodie&&glb===1){const h=at(mk3(Cy(w*1.08,w*.95,1.0,18),'#35405a',1.03),0,-.25,0);h.scale.z=.62;g.add(h)}
if(s.on.chain){const ch=at(new THREE.Mesh(new THREE.TorusGeometry(hr*.8,.03,6,20,Math.PI),B(0xe0b020)),0,.05,zf);ch.rotation.z=Math.PI;g.add(ch)}
if(s.on.cape)g.add(at(new THREE.Mesh(new THREE.PlaneGeometry(w*2+.3,2.3),new THREE.MeshToonMaterial({color:'#8f1d2c',gradientMap:G3,side:THREE.DoubleSide})),0,-1.05,zb-.05));
return g};
const gFoot=()=>at(mk3(new THREE.BoxGeometry(.3,.16,.55),'#f3f1ec',1.05),0,-.06,.12);
function mount3d(){const el=document.getElementById('cv');if(!el)return;if(!window.THREE)return;
try{if(!R){R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=THREE.sRGBEncoding;CLK=new THREE.Clock();OM=new THREE.MeshBasicMaterial({color:0x0b0b0d,side:THREE.BackSide});
SC3=new THREE.Scene();CAM=new THREE.PerspectiveCamera(28,1,.1,60);CAM.position.set(0,2.3,12.5);CAM.lookAt(0,1.85,0);SC3.add(new THREE.HemisphereLight(0xffffff,0x665c70,1.0));KL=new THREE.DirectionalLight(0xffffff,1.1);KL.position.set(3,5,6);SC3.add(KL);RIM=new THREE.DirectionalLight(0xffffff,.8);RIM.position.set(-4,3,-5);SC3.add(RIM);ROOT=new THREE.Group();SC3.add(ROOT);
const c=R.domElement;let x0=0;c.addEventListener('pointerdown',e=>{drag=1;x0=e.clientX});addEventListener('pointerup',()=>drag=0);c.addEventListener('pointermove',e=>{if(drag){rot+=(e.clientX-x0)*.012;x0=e.clientX}})}
el.innerHTML='';el.appendChild(R.domElement);const w=el.clientWidth||320,h=el.clientHeight||380;R.setSize(w,h,false);CAM.aspect=w/h;CAM.updateProjectionMatrix();
if(glb===0){if(THREE.GLTFLoader){glb=3;new THREE.GLTFLoader().load('character.glb?v='+(Date.now()/864e5|0),g=>{try{fit(g);glb=1}catch(e){glb=2}build3d();render()},undefined,()=>{glb=2;render()})}else glb=2}
build3d();
if(!loopOn){loopOn=true;(function L(t){requestAnimationFrame(L);const cv=document.getElementById('cv');if(!document.hidden&&cv&&cv.contains(R.domElement)){if(MIX)MIX.update(CLK.getDelta());ROOT.rotation.y=Math.sin(t/1800)*.35+rot;R.render(SC3,CAM)}})(0)}}
catch(e){el.innerHTML='<p class="sub" style="padding:24px 16px">The 3D view is not supported on this device.</p>'}}
const wipe=o=>o.traverse(n=>{if(n.geometry)n.geometry.dispose();if(n.material&&n.material!==OM)[].concat(n.material).forEach(m=>m.dispose())});
function build3d(){G3=G3||mkG();GT=GT||mkGT();if(MODEL&&MODEL.parent)MODEL.parent.remove(MODEL);GEAR.forEach(o=>{if(o.parent)o.parent.remove(o);wipe(o)});GEAR=[];ROOT.children.slice().forEach(c=>{wipe(c);ROOT.remove(c)});
const S=s.stats,low=clamp(1-s.hp/50,0,1),str=S.str,vit=S.vit,wis=S.wis,calm=S.calm,dead=s.status==='dead',gh=s.status==='revival',real=glb===1&&MODEL;
const skin=`hsl(28,${20+vit*.45}%,${46+vit*.14}%)`,shirt=s.on.hoodie?'#35405a':'#4a6fa5',pants='#2a2d38',eye='#2a2a2a',au=vit>60?'#9fd3ff':'#cfd6e4';
const BODY=new THREE.Group(),X=new THREE.Group();ROOT.add(BODY,X);ROOT.rotation.x=low*.12;
if(real){BODY.add(MODEL);
MODEL.traverse(o=>{if(o.isMesh)[].concat(o.material).forEach(mm=>{const c0=mm.userData.c0;if(!c0)return;mm.color.copy(c0).multiplyScalar(1-low*.4-(vit<40?(40-vit)*.005:0))})});
if(BN.head)attach(BN.head,gHead(HR),0,HR*1.1,0);
if(BN.chest)attach(BN.chest,gChest(.5,HR,.26,-.3),0,.22,0);
BN.feet.forEach(f=>attach(f,s.on.sneakers?gFoot():new THREE.Group(),0,0,0))}
else{BODY.scale.set(1+(str-30)*.004,1,1+(str-30)*.003);
const sw=.55+str*.0042,ar=.12+str*.0015,sh=.2+str*.0017,hr=.38,hy=3.47,sy=2.55,shoe=s.on.sneakers?'#f3f1ec':'#0b0b0d';
[-1,1].forEach(k=>{BODY.add(at(mk3(Cy(.22,.17,.75),pants),k*.22,1.05,0),at(mk3(Cy(.16,.13,.7),pants),k*.22,.4,0),at(mk3(new THREE.BoxGeometry(.3,.16,.55),shoe,s.on.sneakers?1.05:0),k*.22,.08,.1))});
const pel=at(mk3(Sp(.4),pants),0,1.45,0);pel.scale.set(1,.6,.7);BODY.add(pel);
const to=at(mk3(Cy(sw,.4,1.25,16),shirt),0,2.07,0);to.scale.z=.58;BODY.add(to);
if(s.on.hoodie){const hd=at(mk3(new THREE.TorusGeometry(.3,.12,8,16),shirt,1.04),0,2.78,-.12);hd.rotation.x=Math.PI/2.4;BODY.add(hd)}
if(str>55)[-1,1].forEach(k=>{const p=at(mk3(Sp(.27),shirt,1.05),k*.28,2.4,.2);p.scale.set(1,.8,.5);BODY.add(p)});
BODY.add(at(mk3(Cy(.14,.16,.3),skin),0,2.81,0));
[-1,1].forEach(k=>{const A=new THREE.Group();A.position.set(k*(sw+.12),2.55,0);A.rotation.z=k*.18;A.add(mk3(Sp(sh),s.on.hoodie?shirt:skin),at(mk3(Cy(ar*1.15,ar,.6),s.on.hoodie?shirt:skin),0,-.32,0));
const E=new THREE.Group();E.position.y=-.62;E.rotation.x=-.45;E.add(at(mk3(Cy(ar,ar*.8,.55),s.on.hoodie?shirt:skin),0,-.28,0),at(mk3(Sp(ar*1.15,10,8),skin),0,-.6,0));A.add(E);BODY.add(A)});
const H=new THREE.Group();H.position.set(0,3.07,0);const hd=at(mk3(Sp(.38,20,16),skin),0,.4,0);hd.scale.y=1.12;H.add(hd);
const hrr=at(mk3(new THREE.SphereGeometry(.4,20,12,0,Math.PI*2,0,Math.PI*.55),'#1a1410',1.04),0,.44,-.02);hrr.rotation.x=-.25;H.add(hrr);
[-1,1].forEach(k=>{H.add(at(mk3(Sp(.08,8,6),skin,1.1),k*.38,.4,0));const e=at(mk3(Sp(.07,10,8),'#ffffff',1.1),k*.14,.45,.33);e.scale.y=1-low*.5;H.add(e,at(mk3(Sp(.036,8,6),B(eye),0),k*.14,.45,.4));
const br=at(mk3(new THREE.BoxGeometry(.17,.04,.03),'#0b0b0d',0),k*.14,.56,.35);br.rotation.z=-k*clamp((60-calm)/60,-.3,1)*.35;H.add(br)});
const no=at(mk3(new THREE.ConeGeometry(.05,.12,8),skin,1.1),0,.38,.38);no.rotation.x=Math.PI/2;H.add(no);
const mo=at(mk3(new THREE.TorusGeometry(.08,.014,6,12,Math.PI),'#0b0b0d',0),0,.2,.34),mood=(.5-low)*10+(calm-50)*.06;mo.rotation.z=mood>0?Math.PI:0;mo.position.y=mood>0?.26:.2;H.add(mo);
if(calm<35||low>.5)H.add(at(mk3(Sp(.05,8,6),'#6ec1ff',1.1),.38,.52,.22));BODY.add(H);
const gh2=gHead(hr);gh2.position.set(0,hy-.1+.0,0);X.add(gh2);const gc=gChest(sw,hr,.3,-.4);gc.position.y=sy;X.add(gc)}
const sd=at(new THREE.Mesh(new THREE.CircleGeometry(.9,20),B(0x000000,{transparent:true,opacity:.22})),0,.01,0);sd.rotation.x=-Math.PI/2;sd.scale.y=.6;X.add(sd);
const gl=at(new THREE.Sprite(new THREE.SpriteMaterial({map:GT,color:au,transparent:true,opacity:clamp(.1+wis/220,0,.5),depthWrite:false})),0,1.9,-1.2);gl.scale.setScalar(5+wis*.03);X.add(gl);
RIM.color.set(au);const c=R.domElement;c.style.opacity=dead?.5:gh?.55:1;c.style.filter=dead?'grayscale(1)':gh?'saturate(.4) brightness(1.2)':''}
render();
