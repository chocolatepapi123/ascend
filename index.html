<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Ascend</title><style>
:root{--bg:#f6f8f4;--cd:#fff;--ink:#181a17;--mut:#8b9087;--g1:#5c9a45;--g2:#7fba68;--gd:#a06a08;--ln:#e6e9e2;--sh:0 4px 18px rgba(30,50,20,.07);--stage:#bcc4d1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111310;--cd:#1b1e1a;--ink:#eef1ea;--mut:#8f958a;--g1:#6bb054;--g2:#4f8f3d;--gd:#e2b650;--ln:#2b2f29;--sh:none}}
:root[data-theme=dark]{--bg:#111310;--cd:#1b1e1a;--ink:#eef1ea;--mut:#8f958a;--g1:#6bb054;--g2:#4f8f3d;--gd:#e2b650;--ln:#2b2f29;--sh:none}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.w{max-width:480px;margin:0 auto;padding:10px 18px 120px;position:relative}
h1,h2,h3,p{margin:0}h3{font-size:17px;font-weight:650}
.hd{display:flex;align-items:center;gap:4px;position:relative;margin-bottom:8px;min-height:48px}
.hd h1{flex:1;text-align:center;font-size:22px;font-weight:700;letter-spacing:-.01em}.hd h1 span{color:var(--g1)}
.sp{width:34px}
.gp{display:flex;align-items:center;gap:5px;font-weight:650;color:var(--gd);font-size:14px;padding:5px 10px;border-radius:999px;background:var(--cd);box-shadow:var(--sh);border:1px solid var(--ln)}
.ib{background:none;border:0;color:var(--ink);padding:7px;cursor:pointer;display:flex}
.mn{position:absolute;right:0;top:48px;background:var(--cd);border:1px solid var(--ln);border-radius:14px;box-shadow:0 8px 26px rgba(0,0,0,.16);z-index:5;min-width:190px;overflow:hidden}
.mn .dng{color:#d2503f}.cat.off{opacity:.4}.mn button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--ln);color:var(--ink);font:inherit;padding:13px 14px;cursor:pointer}.mn button:last-child{border:0}
.greet{display:flex;align-items:center;gap:12px;margin:14px 0 16px}.greet small{display:block;font-size:14px}.greet b{font-size:19px}
.gi{width:46px;height:46px;border-radius:50%;background:var(--cd);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;color:#e8a020;flex:none}.gi.o{width:42px;height:42px;border-radius:12px;color:#e0661d;background:color-mix(in srgb,#e0661d 12%,var(--cd));box-shadow:none}
.hero{background:linear-gradient(135deg,var(--g2),var(--g1) 70%);color:#fff;border-radius:26px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;box-shadow:0 10px 26px color-mix(in srgb,var(--g1) 35%,transparent)}
.hero small{color:rgba(255,255,255,.8)}.hl1 h2{font-size:30px;font-weight:750;margin:6px 0 2px}
.eb{display:inline-flex;align-items:center;gap:5px;font-size:12px;letter-spacing:.12em;font-weight:650;opacity:.9}
.ring{position:relative;width:118px;height:118px}.ring svg{position:absolute;inset:0;width:100%;height:100%}
.av{position:absolute;inset:11px;border-radius:50%;overflow:hidden;background:var(--stage)}.av svg{display:block;width:100%;height:100%}
.av.big{position:static;width:64px;height:64px;flex:none}
.hc{grid-column:1/-1;display:flex;gap:8px;margin-top:4px}.hc span{flex:1;background:rgba(255,255,255,.16);border-radius:14px;padding:8px 6px;text-align:center}.hc small{display:block;font-size:11px}.hc b{font-size:14px;font-variant-numeric:tabular-nums}
.dv{display:flex;align-items:center;gap:12px;margin:26px 0 10px}.dv span{font-size:12px;letter-spacing:.22em;color:var(--mut)}.dv i{flex:1;height:1px;background:var(--ln)}
.sh2{display:flex;align-items:center;gap:12px;margin:6px 0 12px}.sh2 h3{color:#e0661d}
.sc{display:flex;gap:14px;background:color-mix(in srgb,var(--c) 9%,var(--cd));border-radius:22px;padding:16px;margin-bottom:12px}
.sci{width:46px;height:46px;border-radius:14px;background:var(--cd);color:var(--c);display:flex;align-items:center;justify-content:center;flex:none}
.scb{flex:1;min-width:0}.sct{display:flex;justify-content:space-between;align-items:baseline}.sct b{font-weight:600}.sct span{color:var(--mut);font-size:14px}.sct strong{color:var(--ink);font-size:19px;font-weight:650}
.scb p{font-size:13.5px;color:var(--mut);margin:2px 0 12px}
.sl{position:relative;height:6px;border-radius:3px;background:color-mix(in srgb,var(--c) 18%,transparent);margin:0 7px 0 0}.sl i{position:absolute;left:0;top:0;bottom:0;background:var(--c);border-radius:3px}.sl u{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--cd);border:3px solid var(--c)}
.sub{color:var(--mut);margin:2px 0 14px}.pg{font-size:26px;font-weight:700;margin-top:12px}
.lv{margin:14px 0}.lab{display:flex;justify-content:space-between;font-size:13.5px;color:var(--mut);margin-top:10px}
.bar{height:7px;background:var(--ln);margin:5px 0;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}
.tk,.it,.lrow,.pc{display:flex;align-items:center;gap:12px;background:var(--cd);border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.tk.dn .rb{opacity:.45}.tk.dn b{text-decoration:line-through}
.rb{flex:1;min-width:0;text-align:left}.rb b{display:block;font-weight:600}.rb>span{font-size:13.5px;color:var(--mut);display:block}
.tk em{font-style:normal;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.chs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chp{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:550;padding:3px 9px;border-radius:7px;color:var(--c,var(--mut));background:color-mix(in srgb,var(--c,var(--mut)) 13%,var(--cd))}
.ck{width:30px;height:30px;border:2px solid var(--g1);border-radius:50%;background:none;color:#fff;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;padding:0}
.tk.dn .ck{background:var(--g1)}.ck.bd{color:#d2503f;border-color:#d2503f}
.x{background:none;border:0;color:var(--mut);opacity:.6;padding:6px;cursor:pointer;display:flex}
.box{background:var(--cd);border-left:4px solid #d2503f;padding:14px 16px;margin:0 0 16px;border-radius:18px;box-shadow:var(--sh)}.box p{margin:4px 0 8px;color:var(--mut)}
.wkp{display:flex;justify-content:space-between;gap:6px;margin:14px 0 10px}
.pill{flex:1;border:0;background:color-mix(in srgb,var(--mut) 10%,var(--bg));color:var(--ink);border-radius:999px;padding:10px 0 8px;cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px}
.pill small{font-size:11px;color:var(--mut)}.pill b{font-size:16px;font-weight:600}.pill i{width:5px;height:5px;border-radius:50%;background:var(--g1)}
.pill.on{background:var(--g1);color:#fff}.pill.on small{color:rgba(255,255,255,.8)}.pill.on i{background:#fff}
.dh{font-weight:600;margin:16px 0 14px;padding-top:12px;border-top:1px solid var(--ln)}
.tlw{padding-left:2px}.tli{display:flex;gap:14px;position:relative;padding-bottom:20px}
.tli::before{content:"";position:absolute;left:13px;top:30px;bottom:0;width:2px;background:var(--g1);opacity:.5}.tli:last-child::before{display:none}
.dot{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--g1);background:var(--bg);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;flex:none;cursor:pointer}
.tli.dn .dot{background:var(--g1)}.tli.dn .tlb{opacity:.5}.tli.dn b{text-decoration:line-through}
.tlb{flex:1;min-width:0;margin-top:-2px}.tlt{display:flex;justify-content:space-between;align-items:center}.tlt b{font-weight:600}.tm{display:inline-flex;align-items:center;gap:5px;color:var(--mut);font-size:13.5px}
.fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(88px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--g1);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px color-mix(in srgb,var(--g1) 45%,transparent);cursor:pointer;z-index:3}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}.cat{border:0;background:var(--cd);box-shadow:var(--sh);color:var(--ink);padding:9px 18px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}.cat.on{background:var(--g1);color:#fff}
.iti{width:50px;height:50px;border-radius:15px;background:color-mix(in srgb,var(--c,var(--g1)) 12%,var(--bg));color:var(--c,var(--g1));display:flex;align-items:center;justify-content:center;flex:none}
.it.fm{align-items:flex-end}.it input{margin:6px 0 0;padding:10px}
.sm{border:0;background:color-mix(in srgb,var(--g1) 15%,var(--cd));color:var(--g1);font:inherit;font-size:14px;font-weight:650;border-radius:999px;padding:8px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
textarea{width:100%;padding:12px;margin:8px 0;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;resize:none;min-height:64px}.dt{font-size:13px;color:var(--mut);margin-top:6px;line-height:1.35}.dt p{margin:2px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.dt.o p{display:block}.dt .g{color:#3f9d5a;font-weight:600}.dt .r{color:#d2503f;font-weight:600}
.btn{width:100%;padding:14px;border:0;border-radius:16px;background:var(--g1);color:#fff;font:inherit;font-weight:650;cursor:pointer;margin-top:12px}.btn:disabled{opacity:.4}
.seg{display:flex;background:var(--ln);border-radius:14px;padding:3px;margin:12px 0}.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;font-size:14px;padding:9px;border-radius:11px;cursor:pointer}.seg button.on{background:var(--cd);color:var(--ink)}
.cps{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.cp{border:1px solid var(--ln);background:var(--cd);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}.cp.on{background:var(--g1);border-color:var(--g1);color:#fff}
small{color:var(--mut);font-size:13px;display:block}
.ch{display:flex;gap:6px;align-items:flex-end;height:110px}.ch div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;text-align:center}.ch i{display:block;background:#fff;min-height:4px;border-radius:5px}.ch small{margin-top:4px;font-size:11px}
.wk{display:flex;justify-content:space-between}.dy{text-align:center;min-width:40px}.dy b{display:block;font-size:16px;color:var(--g1)}.dy small{font-size:11px}
.stage{background:var(--stage);border-radius:26px;overflow:hidden;margin-top:6px}.stage svg{display:block;width:100%;height:auto;max-height:62vh}
.say{margin:14px 0 4px}
.pc{margin-top:12px}.pc .rb b{font-size:18px}
.lrow{width:100%;border:0;color:var(--ink);font:inherit;cursor:pointer}.lrow>svg:last-child{color:var(--mut)}
.li{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--c) 13%,var(--bg));color:var(--c);display:flex;align-items:center;justify-content:center;flex:none}
.tg{width:50px;height:30px;border-radius:15px;border:0;background:var(--ln);position:relative;cursor:pointer;flex:none;padding:0}.tg i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}.tg.on{background:var(--g1)}.tg.on i{left:23px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-radius:22px 22px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.07);display:flex;z-index:4;padding:6px 6px env(safe-area-inset-bottom,0px)}
.nav button{flex:1;background:none;border:0;color:var(--mut);opacity:.75;font:inherit;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px}.nav button.on{color:var(--ink);opacity:1;font-weight:650}
.ov{position:fixed;inset:0;background:rgba(10,12,8,.5);z-index:6;display:flex;align-items:flex-end}.sh{background:var(--bg);width:100%;max-width:480px;margin:0 auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:500;max-width:90%;text-align:center;z-index:9}
button:focus-visible,input:focus-visible{outline:3px solid var(--g1);outline-offset:2px}

v><div id="t"></div><script>const KEY='ascend_v1',clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WT={str:20,wis:18,vit:12,calm:12},NM={str:'Power',vit:'Energy',wis:'Brain',calm:'Chill'};
const PRE=[['Workout','str','daily'],['Study / deep work','wis','daily'],['Sleep 7h+','vit','daily'],['Eat clean','vit','daily'],['Meditate','calm','daily'],['Drink water','vit','habit',6],['Doomscrolling','calm','bad'],['Junk food','vit','bad']];
const COS=[{id:'shades',n:'Shades',k:'Head',c:60},{id:'cap',n:'Cap',k:'Head',c:70},{id:'chain',n:'Gold chain',k:'Neck',c:90},{id:'watch',n:'Watch',k:'Wrist',c:75},{id:'sneakers',n:'Red sneakers',k:'Feet',c:80},{id:'tank',n:'Tank top',k:'Torso',c:110}];
const RK=['Rookie','Grinder','Locked In','Veteran','Legend'];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dn=x=>Math.round(Date.parse(x+'T12:00:00')/864e5);
const uid=()=>Math.random().toString(36).slice(2,9);
function fresh(){return{hist:{},lvl:1,xp:0,hp:50,gold:20,align:0,streak:0,doneToday:false,day:today(),status:'alive',rev:null,stats:{str:30,vit:30,wis:30,calm:30},own:{},on:{},
tasks:[['Workout','str','daily'],['Study / deep work','wis','daily'],['Sleep 7h+','vit','daily'],['Meditate','calm','daily'],['Doomscrolling','calm','bad']].map(p=>mk(...p)),
rewards:[{id:uid(),n:'Favourite treat',c:40},{id:uid(),n:'Movie night',c:80}]}}
const clean=x=>x.since?Math.max(0,dn(today())-dn(x.since)):0;
const hst=x=>x.last&&dn(today())-dn(x.last)<=1?(x.st||0):0;
function mk(n,tag,type,w){return{id:uid(),n,tag,type,w:w||WT[tag],done:false}}
let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!s||!s.stats)s=fresh();s.hist=s.hist||{};s.name=s.name||'';
(s.tasks||[]).forEach(x=>{if(x.type==='bad'&&!x.since)x.since=today()});let hm='start',draft={},ex={};let tab='h',menu=false,sheet=false,sm='tpl',sel={stat:'str',type:'daily'},sd=today(),shf='all';
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function toast(m){const t=document.getElementById('t');t.innerHTML='<div class="toast">'+esc(m)+'</div>';clearTimeout(toast.h);toast.h=setTimeout(()=>t.innerHTML='',2600)}
function fall(){s.lvl=Math.max(1,s.lvl-1);s.gold=Math.floor(s.gold/2);s.xp=0;s.hp=0;s.status='revival';s.rev={dl:dn(today())+7,streak:0,doneToday:false};toast('You collapsed. Lost a level and half your LowGold.')}
function roll(){const t=today();if(s.day===t)return;const n=Math.min(3,dn(t)-dn(s.day));
if(s.status==='alive'){s.tasks.filter(x=>x.type==='daily').forEach(x=>{const m=(x.done?0:1)+n-1;for(let i=0;i<m;i++){s.hp-=6;s.stats[x.tag]=Math.max(0,s.stats[x.tag]-2)}});
s.streak=(n===1&&s.doneToday)?s.streak+1:0;if(s.hp<=0){s.hp=0;fall()}}
else if(s.status==='revival'){if(!s.rev.doneToday||n>1)s.rev.streak=0;s.rev.doneToday=false;if(dn(t)>s.rev.dl)s.status='dead'}
s.tasks.forEach(x=>x.done=false);s.align=Math.abs(s.align||0)<=1?0:(s.align||0)-Math.sign(s.align);s.doneToday=false;s.day=t;save()}
function act(id){const x=s.tasks.find(v=>v.id===id);if(!x||s.status==='dead')return;const g=s.status==='revival';
if(x.type==='bad'){x.since=today();s.align=Math.max(-10,(s.align||0)-2);s.stats[x.tag]=Math.max(0,s.stats[x.tag]-3);if(!g){s.hp-=10;if(s.hp<=0){s.hp=0;fall()}}toast('Slip logged'+(g?'':'. -10 HP'))}
else{if(x.type==='daily'&&x.done)return;const w=x.w;x.done=true;if(x.type==='habit'){const t0=today();if(x.last!==t0){x.st=(x.last&&dn(x.last)===dn(t0)-1)?(x.st||0)+1:1;x.last=t0}}s.xp+=w*(g?.5:1);s.hist[today()]=(s.hist[today()]||0)+Math.round(w*(g?.5:1));s.gold+=Math.round(w/2);s.stats[x.tag]=Math.min(100,s.stats[x.tag]+w/5);
s.doneToday=true;s.align=Math.min(10,(s.align||0)+1);if(!g)s.hp=Math.min(50,s.hp+2);
if(g&&w>=18&&!s.rev.doneToday){s.rev.doneToday=true;s.rev.streak++;toast('Recovery day '+s.rev.streak+' of 3')}
else toast('+'+Math.round(w*(g?.5:1))+' XP  +'+Math.round(w/2)+' LowGold');
while(s.xp>=40+s.lvl*20){s.xp-=40+s.lvl*20;s.lvl++;s.hp=g?s.hp:50;toast('Level '+s.lvl+'!')}
if(x.type==='todo')s.tasks=s.tasks.filter(v=>v!==x)}save();render();after(x)}
function del(id){s.tasks=s.tasks.filter(v=>v.id!==id);save();render()}
function buy(k,id){if(s.status!=='alive')return toast('Finish recovery first');

function restore(i){const f=i.files&&i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.stats||!o.tasks)throw 0;s=o;s.hist=s.hist||{};save();render();toast('Backup restored')}catch(e){toast('That file is not an Ascend backup')}};r.readAsText(f)}
const lr=(i,t,sub,on,col)=>`<button class="lrow" onclick="${on}"><span class="li" style="--c:${col||'var(--g1)'}">${ic(i,20)}</span><span class="rb"><b>${t}</b>${sub?`<span>${sub}</span>`:''}</span>${ic('chev',18)}</button>`;
function profile(){const I=info();return`<h2 class="pg">Profile</h2><div class="pc"><div class="av big">${charSvg(AV,'')}</div><div class="rb"><b>${esc(nm())}</b><span>${I.title}, level ${s.lvl}</span></div><button class="sm" onclick="rename()">${ic('pen',14)} Edit</button></div>
${dv('GENERAL')}${lr('user','Character','Photo, stats and wardrobe',"tab='c';render();scrollTo(0,0)")}
<div class="lrow"><span class="li" style="--c:#5b6bd6">${ic('moon',20)}</span><span class="rb"><b>Dark mode</b></span><button class="tg${dark()?' on':''}" role="switch" aria-checked="${dark()}" aria-label="Dark mode" onclick="setTheme()"><i></i></button></div>
${dv('ACCOUNT AND BACKUP')}${lr('down','Back up data','Save a file to this phone','backup()','#3b78d8')}${lr('up','Restore from backup','Pick a saved backup file',"document.getElementById('rf').click()",'#3b78d8')}<input id="rf" type="file" accept=".json,application/json" style="display:none" onchange="restore(this)">${lr('reset','Reset progress','Start over from level 1',"confirm('Reset all progress?')&&reborn()",'#d2503f')}`}
function chr(){const I=info(),own=COS.filter(c=>s.own[c.id]);
return`<div class="stage">${charSvg(FULL,'full')}</div><p class="say">${I.say}</p><small>Build: ${buildOf()}, mood: ${moodOf()||'neutral'}</small>${lvBlock()}${dv('EMOTES')}<div class="cats">${EMOTES.map(e=>`<button class="cat${hasEmote(e)?'':' off'}" onclick="play('${e}',3500)">${e[0].toUpperCase()+e.slice(1)}</button>`).join('')}</div>${EMOTES.some(hasEmote)?'':'<p class="sub" style="margin-top:10px">Emotes unlock when you add emote images to the char folder.</p>'}${dv('WARDROBE')}${own.map(c=>`<div class="it"><div class="iti">${ic(GI[c.id],24)}</div><div class="rb"><b>${c.n}</b><span>${c.k}</span></div><button class="sm" onclick="buy('c','${c.id}')">${s.on[c.id]?'Take off':'Wear'}</button></div>`).join('')||'<p class="sub">Nothing owned yet. Buy gear in the Shop and it shows up here.</p>'}`}
function pick(k,v,e){sel[k]=v;document.querySelectorAll('[data-k="'+k+'"]').forEach(b=>b.classList.toggle('on',b===e))}
function addNew(){const n=f_n.value.trim();if(!n)return toast('Give it a name first');const x=mk(n,sel.stat,sel.type);if(sel.type==='daily')x.t=f_t.value;s.tasks.push(x);sheet=false;save();render();toast('Added')}
function addPre(i){const p=PRE[i];s.tasks.push(mk(p[0],p[1],p[2],p[3]));sheet=false;save();render();toast('Added '+p[0])}
const HELP=[['tasks','Daily Grind','Do them every day. Miss one and you lose HP and a little of that skill.'],['dumb','Habits','Start habits build streaks. Stop habits count clean days. Add why it matters and what it costs you. Slips cost HP, so be honest.'],['check','Side Quests','One-offs. Finish it and it disappears.'],['flame','XP and levels','Everything you finish gives XP. Each level needs a bit more than the last.'],['coin','LowGold','Earned with XP. Spend it on gear and your own treats in the Shop.'],['heart','HP','At zero you collapse, drop a level and lose half your LowGold. Three days of hard tasks gets you back up.']];
const HI={start:[['Drink water','vit','Better focus, energy and skin.','Headaches and afternoon crashes.'],['Read 10 pages','wis','A sharper mind and calmer evenings.','Another night lost to the phone.'],['Stretch','vit','Less stiffness, better sleep.','Tight back and stiff mornings.'],['Journal','calm','A clearer head and less stress.','Worries pile up in my head.']],
stop:[['Doomscrolling','calm','Hours back and a quieter head.','Wasted time and a restless mind.'],['Junk food','vit','More energy and a leaner build.','Sluggish, bloated and guilty.'],['Late-night phone','vit','Better sleep and easier mornings.','Tired all day tomorrow.'],['Nail biting','calm','Better hands and less tension.','Sore fingers and stress habits.']]};
const chp=(k,a)=>a.map(o=>`<button class="cp${sel[k]===o[0]?' on':''}" data-k="${k}" data-v="${o[0]}" onclick="pick('${k}','${o[0]}',this)">${o[1]}</button>`).join('');
function openHabit(){draft={};sheet='habit';render()}
function setHm(m){draft={n:f_n.value,b:f_b.value,c:f_c.value};hm=m;render()}
function idea(i){const p=HI[hm][i];f_n.value=p[0];f_b.value=p[2];f_c.value=p[3];sel.stat=p[1];document.querySelectorAll('[data-k="stat"]').forEach(b=>b.classList.toggle('on',b.dataset.v===p[1]))}
function addHabit(){const n=f_n.value.trim();if(!n)return toast('Give it a name first');const st=hm==='start',x=mk(n,sel.stat,st?'habit':'bad');x.ben=f_b.value.trim();x.con=f_c.value.trim();if(!st)x.since=today();s.tasks.push(x);sheet=false;tt='h';draft={};save();render();toast(st?'Habit started':'Clean streak starts today')}
function habitH(){const st=hm==='start';
return`<div class="ov" onclick="sheet=false;render()"><div class="sh" onclick="event.stopPropagation()"><h3>${st?'Start a habit':'Stop a habit'}</h3><div class="seg"><button class="${st?'on':''}" onclick="setHm('start')">Start</button><button class="${st?'':'on'}" onclick="setHm('stop')">Stop</button></div><p class="sub" style="margin:0 0 6px">${st?'Something you want to do more. Tap it each time you do it and your streak grows.':'Something you want to cut. Log a slip when it happens. Your clean days count up until then.'}</p>
<input id="f_n" placeholder="${st?'e.g. Read 10 pages':'e.g. Doomscrolling'}" maxlength="50" value="${esc(draft.n||'')}">
<small>${st?'What I get out of it':'What I gain by quitting'}</small><textarea id="f_b" maxlength="140" placeholder="${st?'Why is this worth it?':'What gets better?'}">${esc(draft.b||'')}</textarea>
<small>${st?'What happens if I skip it':'What it costs me when I slip'}</small><textarea id="f_c" maxlength="140" placeholder="${st?'What do I risk?':'What does it cost me?'}">${esc(draft.c||'')}</textarea>
<small>${st?'Boosts which stat':'Drags down which stat'}</small><div class="cps">${chp('stat',Object.keys(NM).map(k=>[k,NM[k]]))}</div>
<small>Ideas</small><div class="cps">${HI[hm].map((p,i)=>`<button class="cp" onclick="idea(${i})">${p[0]}</button>`).join('')}</div>
${st?'':'<small>Each slip costs 10 HP and a little of that stat.</small>'}<button class="btn" onclick="addHabit()">${st?'Start this habit':'Quit this habit'}</button></div></div>`}
function sheetH(){if(sheet==='habit')return habitH();if(sheet==='help')return`<div class="ov" onclick="sheet=false;render()"><div class="sh" onclick="event.stopPropagation()"><h3 style="margin-bottom:12px">How it works</h3>${HELP.map(h=>`<div class="it"><div class="iti">${ic(h[0],22)}</div><div class="rb"><b>${h[1]}</b><span>${h[2]}</span></div></div>`).join('')}</div></div>`;
const ch=(k,a)=>a.map(o=>`<button class="cp${sel[k]===o[0]?' on':''}" data-k="${k}" data-v="${o[0]}" onclick="pick('${k}','${o[0]}',this)">${o[1]}</button>`).join('');
if(sel.type!=='todo')sel.type='daily';
return`<div class="ov" onclick="sheet=false;render()"><div class="sh" onclick="event.stopPropagation()"><h3>Add a task</h3><div class="seg"><button class="${sm=='new'?'on':''}" onclick="sm='new';render()">Write your own</button><button class="${sm=='tpl'?'on':''}" onclick="sm='tpl';render()">Quick picks</button></div>`+
(sm=='new'?`<input id="f_n" placeholder="What are you doing?" maxlength="50"><small>Type</small><div class="cps">${ch('type',[['daily','Every day'],['todo','Side quest']])}</div><small>Boosts which stat</small><div class="cps">${ch('stat',Object.keys(NM).map(k=>[k,NM[k]]))}</div><small>Time of day (daily only)</small><input id="f_t" type="time"><small>XP depends on the stat, so you can't cheat the scale.</small><button class="btn" onclick="addNew()">Add it</button>`:PRE.map((p,i)=>p[2]!=='daily'?'':`<div class="it"><div class="iti" style="--c:${SC[p[1]]}">${ic(SI[p[1]],22)}</div><div class="rb"><b>${p[0]}</b><span>${NM[p[1]]}, ${p[2]==='bad'?'slip-up':p[2]==='daily'?'every day':'habit'}</span></div><button class="sm" onclick="addPre(${i})">Add</button></div>`).join('')+`<button class="sm" style="margin-top:6px" onclick="openHabit()">Add a habit instead</button>`)+`</div></div>`}
const mi=(i,l,f,c)=>`<button${c?` class="${c}"`:''} onclick="menu=false;${f}">${ic(i,18)}${l}</button>`;
const menuH=()=>menu?`<div class="mn" onclick="event.stopPropagation()">${mi('user','Character',"tab='c';render();scrollTo(0,0)")}${mi('plus','Quick add',"sheet=true;render()")}${mi(dark()?'sun':'moon',dark()?'Light mode':'Dark mode',"setTheme()")}${mi('down','Back up data',"backup()")}${mi('help','How it works',"sheet='help';render()")}${mi('reset','Reset progress',"confirm('Reset all progress?')?reborn():render()",'dng')}</div>`:'';
document.addEventListener('click',()=>{if(menu){menu=false;render()}});
function render(){roll();s.hist=s.hist||{};document.documentElement.dataset.theme=s.theme||'';const T={h:home,t:tasks,x:stats,s:shop,p:profile,c:chr};
document.getElementById('app').innerHTML=`<header class="hd">${tab==='c'?`<button class="ib" aria-label="Back" onclick="tab='p';render()">${ic('back',22)}</button>`:'<span class="sp"></span>'}<h1><span>As</span>cend</h1><span class="gp">${ic('coin',16)}${Math.floor(s.gold)}</span><button class="ib" aria-label="Menu" onclick="event.stopPropagation();menu=!menu;render()">${ic('dots',22)}</button>${menuH()}</header>${T[tab]()}`;
document.getElementById('nav').innerHTML=[['h','home','Home'],['t','tasks','Tasks'],['x','stats','Stats'],['s','shop','Shop'],['p','user','Profile']].map(a=>`<button class="${tab==a[0]?'on':''}" onclick="tab='${a[0]}';menu=false;render();scrollTo(0,0)">${ic(a[1],22)}<span>${a[2]}</span></button>`).join('');
document.getElementById('sheet').innerHTML=sheet?sheetH():''}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
render();
</script></body></html>
