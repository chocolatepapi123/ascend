<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Ascend</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e4e6eb;--pn:#fff;--ink:#14151a;--mut:#5b6070;--acc:#d99200;--hp:#e5383b;--xp:#2b9348;--gd:#a87400;--ln:#14151a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101116;--pn:#1b1d25;--ink:#f2f0ea;--mut:#9aa0b2;--acc:#ffb400;--hp:#ff4d5a;--xp:#43c466;--gd:#ffc83d;--ln:#000}}
:root[data-theme=dark]{--bg:#101116;--pn:#1b1d25;--ink:#f2f0ea;--mut:#9aa0b2;--acc:#ffb400;--hp:#ff4d5a;--xp:#43c466;--gd:#ffc83d;--ln:#000}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Archivo,system-ui,sans-serif}
.w{max-width:480px;margin:0 auto;padding:12px 12px 40px}
h1,h2,.an{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.02em;margin:0}
.hero{background:var(--pn);border:3px solid var(--ln);border-radius:6px;box-shadow:5px 5px 0 var(--ln);padding:10px 12px 12px;text-align:center}
.hero svg{width:min(62%,250px);height:auto;display:block;margin:0 auto}
.tier{font-size:30px;line-height:1}.say{color:var(--mut);min-height:20px;margin:4px 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.lv{background:var(--acc);color:#14151a;border:3px solid var(--ln);padding:2px 10px;font-family:Anton;font-size:20px;border-radius:4px}
.gold{font-family:Anton;font-size:20px;color:var(--gd)}
.bar{height:12px;background:rgba(128,128,128,.25);border:2px solid var(--ln);border-radius:3px;overflow:hidden;margin:3px 0 7px}
.bar i{display:block;height:100%}
.lab{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);text-align:left}
.al{height:14px;border:2px solid var(--ln);border-radius:3px;position:relative;background:linear-gradient(90deg,#c1121f,#4a1a2a 45%,#6b7a99 50%,#f4e7a1 55%,#fff)}
.al b{position:absolute;top:-4px;width:6px;height:20px;background:var(--ink);border:2px solid var(--ln);transform:translateX(-50%)}
.st{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;margin-top:8px}
.tabs{display:flex;gap:8px;margin:14px 0 10px}
.tabs button{flex:1;padding:9px;border:3px solid var(--ln);background:var(--pn);color:var(--ink);font:400 18px Anton;border-radius:4px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#14151a}
h2{font-size:20px;margin:14px 0 6px}
.row{display:flex;align-items:center;gap:10px;background:var(--pn);border:2px solid var(--ln);border-radius:5px;padding:8px 10px;margin-bottom:7px}
.row.done{opacity:.5}.row.done b{text-decoration:line-through}
.row div{flex:1;min-width:0}small{display:block;color:var(--mut);font-size:12px}
.chk{width:42px;height:42px;border:3px solid var(--ln);border-radius:5px;background:var(--xp);color:#fff;font:700 18px Archivo;cursor:pointer;flex:none}
.chk.bad{background:var(--hp)}.chk.sm{width:auto;padding:0 12px;font-size:14px;background:var(--acc);color:#14151a}
.x{background:none;border:0;color:var(--mut);font-size:16px;cursor:pointer;padding:6px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.pnl{background:var(--pn);border:3px solid var(--ln);border-radius:5px;padding:12px;margin:12px 0}
.pnl.red{border-color:var(--hp)}
input,select{width:100%;padding:10px;margin:0 0 8px;border:2px solid var(--ln);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit}
.btn{width:100%;padding:11px;border:3px solid var(--ln);border-radius:4px;background:var(--acc);color:#14151a;font:400 18px Anton;cursor:pointer}
.btn:disabled{opacity:.45}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-weight:600;max-width:90%;text-align:center;z-index:5}
</style></head><body><div class="w" id="app"></div><div id="t"></div>
<script>
const KEY='ascend_v1',clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WT={str:20,wis:18,vit:12,calm:12},NM={str:'Strength',vit:'Vitality',wis:'Wisdom',calm:'Calm'};
const PRE=[['Workout','str','daily'],['Study / deep work','wis','daily'],['Sleep 7h+','vit','daily'],['Eat clean','vit','daily'],['Meditate','calm','daily'],['Drink water','vit','habit',6],['Doomscrolling','calm','bad'],['Junk food','vit','bad']];
const COS=[{id:'shades',n:'Shades',c:60},{id:'chain',n:'Gold chain',c:90},{id:'cape',n:'Crimson cape',c:140}];
const ANG=['Mortal','Touched','Blessed','Exalted','Seraph'],DEV=['Mortal','Tempted','Corrupted','Infernal','Archdemon'];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dn=x=>Math.round(Date.parse(x+'T12:00:00')/864e5);
const uid=()=>Math.random().toString(36).slice(2,9);
function fresh(){return{lvl:1,xp:0,hp:50,gold:20,align:0,streak:0,doneToday:false,day:today(),status:'alive',rev:null,stats:{str:30,vit:30,wis:30,calm:30},own:{},on:{},
tasks:[['Workout','str','daily'],['Study / deep work','wis','daily'],['Sleep 7h+','vit','daily'],['Meditate','calm','daily'],['Doomscrolling','calm','bad']].map(p=>mk(...p)),
rewards:[{id:uid(),n:'Favourite treat',c:40},{id:uid(),n:'Movie night',c:80}]}}
function mk(n,tag,type,w){return{id:uid(),n,tag,type,w:w||WT[tag],done:false}}
let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!s||!s.stats)s=fresh();
let tab='t',form=false,msg='';
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function toast(m){const t=document.getElementById('t');t.innerHTML='<div class="toast">'+esc(m)+'</div>';clearTimeout(toast.h);toast.h=setTimeout(()=>t.innerHTML='',2600)}
function fall(){s.lvl=Math.max(1,s.lvl-1);s.gold=Math.floor(s.gold/2);s.xp=0;s.hp=0;s.status='revival';s.rev={dl:dn(today())+7,streak:0,doneToday:false};toast('You collapsed. Lost a level and half your gold.')}
function roll(){const t=today();if(s.day===t)return;const n=Math.min(3,dn(t)-dn(s.day));
if(s.status==='alive'){s.tasks.filter(x=>x.type==='daily').forEach(x=>{const m=(x.done?0:1)+n-1;for(let i=0;i<m;i++){s.hp-=6;s.align=clamp(s.align-3,-100,100);s.stats[x.tag]=Math.max(0,s.stats[x.tag]-2)}});
s.streak=(n===1&&s.doneToday)?s.streak+1:0;if(s.hp<=0){s.hp=0;fall()}}
else if(s.status==='revival'){if(!s.rev.doneToday||n>1)s.rev.streak=0;s.rev.doneToday=false;if(dn(t)>s.rev.dl)s.status='dead'}
s.tasks.forEach(x=>x.done=false);s.doneToday=false;s.day=t;save()}
function act(id){const x=s.tasks.find(v=>v.id===id);if(!x||s.status==='dead')return;const g=s.status==='revival';
if(x.type==='bad'){s.align=clamp(s.align-6,-100,100);s.stats[x.tag]=Math.max(0,s.stats[x.tag]-3);if(!g){s.hp-=10;if(s.hp<=0){s.hp=0;fall()}}toast('Ouch. Darkness creeps in.')}
else{if(x.type==='daily'&&x.done)return;const w=x.w;x.done=true;s.xp+=w*(g?.5:1);s.gold+=Math.round(w/2);s.stats[x.tag]=Math.min(100,s.stats[x.tag]+w/5);
s.align=clamp(s.align+w/6+Math.min(s.streak,10)*.15,-100,100);s.doneToday=true;if(!g)s.hp=Math.min(50,s.hp+2);
if(g&&w>=18&&!s.rev.doneToday){s.rev.doneToday=true;s.rev.streak++;toast('Redemption day '+s.rev.streak+' of 3')}
else toast('+'+Math.round(w*(g?.5:1))+' XP  +'+Math.round(w/2)+' gold');
while(s.xp>=40+s.lvl*20){s.xp-=40+s.lvl*20;s.lvl++;s.hp=g?s.hp:50;toast('Level '+s.lvl+'!')}
if(x.type==='todo')s.tasks=s.tasks.filter(v=>v!==x)}save();render()}
function del(id){s.tasks=s.tasks.filter(v=>v.id!==id);save();render()}
function buy(k,id){if(s.status!=='alive')return toast('Revive first.');
if(k==='c'){const c=COS.find(v=>v.id===id);if(s.own[id]){s.on[id]=!s.on[id]}else if(s.gold>=c.c){s.gold-=c.c;s.own[id]=1;s.on[id]=1;toast(c.n+' equipped')}else toast('Not enough gold')}
else{const r=s.rewards.find(v=>v.id===id);if(s.gold>=r.c){s.gold-=r.c;toast('Enjoy: '+r.n)}else toast('Not enough gold')}save();render()}
function revive(){const c=100+25*s.lvl;if(s.rev.streak>=3&&s.gold>=c){s.gold-=c;s.status='alive';s.hp=25;s.rev=null;toast('You rise again.');save();render()}}
function reborn(){s=fresh();save();render()}
function fillP(i){const p=PRE[i];if(!p)return;f_n.value=p[0];f_g.value=p[1];f_y.value=p[2]}
function addT(){const n=f_n.value.trim();if(!n)return;const p=PRE.find(v=>v[0]===n);s.tasks.push(mk(n,f_g.value,f_y.value,p&&p[3]));form=false;save();render()}
function addR(){const n=r_n.value.trim(),c=parseInt(r_c.value);if(!n||!(c>0))return;s.rewards.push({id:uid(),n,c});save();render()}
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)),mix=(a,b,t)=>{const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
function draw(){const S=s.stats,a=clamp(s.align,0,100)/100,d=clamp(-s.align,0,100)/100,m=Math.max(a,d),up=a>=d;
const low=clamp(1-s.hp/50,0,1),str=S.str,vit=S.vit,wis=S.wis,calm=S.calm,dead=s.status==='dead',gh=s.status==='revival';
const sw=24+str*.24,ar=11+str*.13,sl=low*10,hy=72+sl,ty=108+sl*.5,I='#0b0b0d';
const skin=`hsl(28,${20+vit*.45}%,${46+vit*.14}%)`,shirt=mix('#4a6fa5',up?'#f4f1e8':'#3a1018',m),eye=mix('#2a2a2a',up?'#f5c542':'#e02020',m),au=mix('#7ec8ff',up?'#ffd84a':'#ff3b3b',m);
const o=`stroke="${I}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
const ln=(x1,y1,x2,y2,w,c)=>`<path d="M${x1} ${y1}L${x2} ${y2}" fill="none" stroke="${I}" stroke-width="${w+6}" stroke-linecap="round"/><path d="M${x1} ${y1}L${x2} ${y2}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const X=100+sw-4,wing=(amt,fill,p)=>amt<.08?'':[0,1].map(i=>`<g ${i?'transform="translate(200,0) scale(-1,1)"':''} opacity="${clamp(amt*3,0,1)}"><path ${o} fill="${fill}" transform="translate(${X},130) scale(${.4+.6*amt}) translate(${-X},-130)" d="${p}"/></g>`).join('');
const aw=`M${X} 118C${X+30} 58 ${X+92} 28 ${X+96} 70C${X+100} 92 ${X+70} 100 ${X+80} 122C${X+60} 124 ${X+40} 140 ${X} 152Z`;
const dw=`M${X} 118L${X+30} 40L${X+48} 80L${X+70} 28L${X+84} 90L${X+102} 58L${X+90} 134Q${X+50} 120 ${X} 152Z`;
const bt=Math.max(0,(55-vit)/55)+low*.6,e=(x)=>dead?`<path d="M${x-4} ${hy-5}l8 8m0-8l-8 8" stroke="${I}" stroke-width="2.5"/>`:`<ellipse cx="${x}" cy="${hy-1}" rx="5" ry="${3.5-low}" fill="#fff" stroke="${I}" stroke-width="2"/><circle cx="${x}" cy="${hy-1}" r="2.6" fill="${eye}"/>`;
const k=clamp((60-calm)/60,-.3,1)*4+d*3-a,mo=clamp((.5-low)*10+(calm-50)*.06+a*2,-5,6);
const hn=(sg)=>`<path ${o} fill="#2b0a10" d="M${100+sg*16} ${hy-22}Q${100+sg*32} ${hy-40} ${100+sg*24} ${hy-54}Q${100+sg*8} ${hy-42} ${100+sg*6} ${hy-26}Z"/>`;
return`<svg viewBox="0 0 200 250" role="img" aria-label="Your character" style="overflow:visible;${dead?'filter:grayscale(1);opacity:.5':gh?'opacity:.55;filter:saturate(.4) brightness(1.2)':vit>60?`filter:drop-shadow(0 0 ${(vit-55)/3}px ${au})`:''}">
<defs><radialGradient id="au"><stop offset=".3" stop-color="${au}" stop-opacity=".85"/><stop offset="1" stop-color="${au}" stop-opacity="0"/></radialGradient></defs>
<circle cx="100" cy="130" r="${60+wis*.6}" fill="url(#au)" opacity="${clamp(.12+wis/130,0,.8)}"/>
${wing(a,'#fbfaf5',aw)}${wing(d,'#7a1020',dw)}
${d>.2?`<path d="M104 188Q${110+d*40} 215 ${126+d*14} ${176-d*10}" fill="none" stroke="#9c1625" stroke-width="5" stroke-linecap="round"/>`:''}
${s.on.cape?`<path ${o} fill="#b3122a" d="M${100-sw+4} ${ty}L${100+sw-4} ${ty}L${100+sw+12} 222Q100 240 ${100-sw-12} 222Z"/>`:''}
${ln(88,176,86,238,22+str*.05,'#23252e')}${ln(112,176,114,238,22+str*.05,'#23252e')}
<ellipse cx="82" cy="240" rx="14" ry="6" fill="${I}"/><ellipse cx="118" cy="240" rx="14" ry="6" fill="${I}"/>
${ln(100-sw,ty+6,100-sw-8,176+sl*.5,ar,skin)}${ln(100+sw,ty+6,100+sw+8,176+sl*.5,ar,skin)}
${ln(100,ty-12,100,ty+2,14,skin)}
<path ${o} fill="${shirt}" d="M${100-sw} ${ty+4}Q100 ${ty-8} ${100+sw} ${ty+4}L${116+str*.05} 182L${84-str*.05} 182Z"/>
${str>55?`<path d="M100 ${ty+8}V${ty+32}M${100-sw*.5} ${ty+14}Q${100-sw*.25} ${ty+30} 96 ${ty+30}M${100+sw*.5} ${ty+14}Q${100+sw*.25} ${ty+30} 104 ${ty+30}" stroke="${I}" stroke-width="2" fill="none" opacity="${(str-50)/60}"/>`:''}
${low>.4?`<g opacity="${low}"><path fill="${skin}" ${o} stroke-width="2" d="M82 ${ty+26}l10 6-6 5 12 4-14 8z"/><path fill="${skin}" ${o} stroke-width="2" d="M118 ${ty+14}l-12 6 7 5-10 6 13 6z"/></g>`:''}
${s.on.chain?`<path d="M88 ${ty+2}Q100 ${ty+26} 112 ${ty+2}" fill="none" stroke="#f2c200" stroke-width="3.5"/>`:''}
<ellipse cx="79" cy="${hy}" rx="4" ry="7" fill="${skin}" ${o} stroke-width="2"/><ellipse cx="121" cy="${hy}" rx="4" ry="7" fill="${skin}" ${o} stroke-width="2"/>
<ellipse cx="100" cy="${hy}" rx="21" ry="25" fill="${skin}" ${o}/>
<path ${o} fill="#1a1410" d="M79 ${hy-8}Q78 ${hy-36} 100 ${hy-33}Q123 ${hy-36} 121 ${hy-8}Q112 ${hy-22} 100 ${hy-20}Q88 ${hy-22} 79 ${hy-8}Z"/>
${d>.12?`<g transform="translate(100,${hy-30}) scale(${.5+d*.7}) translate(-100,${-(hy-30)})">${hn(-1)}${hn(1)}</g>`:''}
<path d="M85 ${hy-9}L96 ${hy-9+k}M115 ${hy-9}L104 ${hy-9+k}" stroke="${I}" stroke-width="3" stroke-linecap="round"/>
${e(91)}${e(109)}
${bt>.1?`<path d="M86 ${hy+5}q5 3 10 0M104 ${hy+5}q5 3 10 0" stroke="#5a3a5a" stroke-width="1.8" fill="none" opacity="${clamp(bt,0,.85)}"/>`:''}
<path d="M92 ${hy+13}Q100 ${hy+13+mo} 108 ${hy+13}" fill="none" stroke="${I}" stroke-width="3" stroke-linecap="round"/>
${s.on.shades?`<path d="M82 ${hy-7}h36v9q-4 4-8 0h-20q-4 4-8 0z" fill="${I}"/>`:''}
${calm<35||low>.5?`<path d="M126 ${hy-8}q-5 8 0 10q5-2 0-10z" fill="#6ec1ff" stroke="${I}" stroke-width="1.5"/>`:''}
${a>.1?`<ellipse cx="100" cy="${hy-42+Math.sin(0)}" rx="22" ry="6" fill="none" stroke="#ffd84a" stroke-width="4.5" opacity="${clamp(a*1.6,0,1)}" style="filter:drop-shadow(0 0 4px #ffd84a)"/>`:''}
</svg>`}
const bar=(l,v,mx,c)=>`<div class="lab"><span>${l}</span><span>${Math.round(v)}/${mx}</span></div><div class="bar"><i style="width:${clamp(v/mx*100,0,100)}%;background:${c}"></i></div>`;
function trow(x){const bad=x.type==='bad';return`<div class="row ${x.done?'done':''}"><button class="chk ${bad?'bad':''}" aria-label="${bad?'Log slip':'Complete'}" onclick="act('${x.id}')">${bad?'✕':x.done?'✓':''}</button><div><b>${esc(x.n)}</b><small>${NM[x.tag]} · ${bad?'costs HP':'+'+x.w+' XP'}</small></div><button class="x" aria-label="Delete" onclick="del('${x.id}')">🗑</button></div>`}
function render(){roll();const need=40+s.lvl*20,A=Math.abs(s.align),ix=A<15?0:A<35?1:A<60?2:A<85?3:4,title=ix?(s.align>0?ANG:DEV)[ix]:'Mortal',hr=new Date().getHours();
const open=s.tasks.filter(x=>x.type==='daily'&&!x.done).length;
let say=s.status==='dead'?'Gone. Nothing left but a ghost story.':s.status==='revival'?'A ghost of yourself. Earn your way back.':s.hp<15?'Barely standing. One more slip and you fall.':s.hp<30?'Bruised, torn and exhausted.':(open&&hr>=18)?`Looks worried: ${open} daily${open>1?'s':''} still open.`:s.align>35?'Radiating. Keep it up.':s.align<-35?'Something dark is taking hold.':'Standing at the crossroads.';
let h=`<div class="top"><span class="lv">LV ${s.lvl}</span><span class="an" style="font-size:15px;color:var(--mut)">${s.streak} day streak</span><span class="gold">${Math.floor(s.gold)} G</span></div>
<div class="hero">${draw()}<div class="tier an" style="color:${ix?(s.align>0?'var(--gd)':'var(--hp)'):'var(--ink)'}">${title.toUpperCase()}</div><div class="say">${say}</div>
${bar('HP',s.hp,50,'var(--hp)')}${bar('XP',s.xp,need,'var(--xp)')}
<div class="lab"><span>Devil</span><span>Angel</span></div><div class="al"><b style="left:${50+s.align/2}%"></b></div>
<div class="st">${Object.keys(NM).map(k=>bar(NM[k],s.stats[k],100,'var(--acc)')).join('')}</div></div>`;
if(s.status==='revival'){const c=100+25*s.lvl,dl=s.rev.dl-dn(today());h+=`<div class="pnl red"><h2 style="margin:0 0 6px">Redemption</h2><p style="margin:0 0 8px">Finish a hard task (Workout or Study) on 3 days in a row. ${dl} day${dl==1?'':'s'} left, or you die. Missing a day resets the streak. XP is halved.</p>${bar('Streak',s.rev.streak,3,'var(--xp)')}<button class="btn" ${s.rev.streak>=3&&s.gold>=c?'':'disabled'} onclick="revive()">Revive for ${c} G</button></div>`}
if(s.status==='dead')h+=`<div class="pnl red"><h2 style="margin:0 0 6px">You died</h2><p style="margin:0 0 8px">The window closed. Start a new life.</p><button class="btn" onclick="reborn()">Reincarnate</button></div>`;
h+=`<div class="tabs"><button class="${tab=='t'?'on':''}" onclick="tab='t';render()">TASKS</button><button class="${tab=='s'?'on':''}" onclick="tab='s';render()">SHOP</button></div>`;
if(tab==='t'){const L=t=>s.tasks.filter(x=>t.includes(x.type)).map(trow).join('')||'<small>Nothing here yet.</small>';
h+=`<h2>Dailies</h2>${L(['daily'])}<h2>Habits</h2>${L(['habit','bad'])}<h2>To-dos</h2>${L(['todo'])}`;
h+=form?`<div class="pnl"><select onchange="fillP(this.value)"><option value="">Pick a preset…</option>${PRE.map((p,i)=>`<option value="${i}">${p[0]}</option>`).join('')}</select><input id="f_n" placeholder="Task name" maxlength="50"><select id="f_g">${Object.keys(NM).map(k=>`<option value="${k}">${NM[k]}</option>`).join('')}</select><select id="f_y"><option value="daily">Daily</option><option value="habit">Habit (good)</option><option value="bad">Bad habit</option><option value="todo">To-do</option></select><button class="btn" onclick="addT()">Save task</button></div>`:`<button class="btn" style="margin-top:12px" onclick="form=true;render()">+ ADD TASK</button>`}
else{h+=`<h2>Real rewards</h2>${s.rewards.map(r=>`<div class="row"><div><b>${esc(r.n)}</b><small>${r.c} G</small></div><button class="chk sm" onclick="buy('r','${r.id}')">Buy</button></div>`).join('')}
<div class="pnl"><input id="r_n" placeholder="New reward" maxlength="40"><input id="r_c" type="number" min="1" placeholder="Cost in gold"><button class="btn" onclick="addR()">Add reward</button></div>
